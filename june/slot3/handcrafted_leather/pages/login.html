<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to your LeatherCraft Bindery account — manage orders, track shipments, and access your custom journal history." />
  <title>Login | LeatherCraft Bindery</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='4' y='6' width='5' height='32' rx='2' fill='%232F5D50'/><rect x='9' y='4' width='28' height='36' rx='3' fill='%232F5D50'/><rect x='16' y='14' width='16' height='2' rx='1' fill='%23C4A962'/></svg>" />
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/animations.css" />
  <link rel="stylesheet" href="../assets/css/navbar.css" />
  <link rel="stylesheet" href="../assets/css/footer.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <style>
    .auth-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #1e3d34 0%, #2f5d50 55%, #3d7a69 100%);
    }

    /* Animated background orbs */
    .auth-page-wrap::before,
    .auth-page-wrap::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .auth-page-wrap::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(196,169,98,0.18) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      animation: float 8s ease-in-out infinite;
    }
    .auth-page-wrap::after {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(47,93,80,0.35) 0%, transparent 70%);
      bottom: -80px;
      right: -80px;
      animation: float 10s ease-in-out infinite reverse;
    }

    .auth-inner {
      position: relative;
      z-index: 2;
      padding: var(--space-6);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.2);
      padding: clamp(2rem, 5vw, 3.5rem);
      width: min(440px, 100%);
      text-align: center;
      animation: fade-in-up 0.7s ease both;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 2rem;
    }

    .auth-logo-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .auth-logo-name {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--antique-gold);
      letter-spacing: -0.02em;
    }

    .auth-eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(196,169,98,0.8);
      margin-bottom: 0.5rem;
    }

    .auth-title {
      font-family: var(--font-heading);
      font-size: clamp(1.8rem, 4vw, 2.2rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .auth-subtitle {
      font-size: 0.9rem;
      color: rgba(248,245,238,0.65);
      margin-bottom: 2rem;
    }

    .auth-divider {
      width: 48px;
      height: 2px;
      background: var(--antique-gold);
      margin: 0 auto 2rem;
      border-radius: 2px;
      opacity: 0.7;
    }

    .auth-form {
      text-align: left;
    }

    .auth-form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .auth-form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(248,245,238,0.7);
      margin-bottom: 0.5rem;
    }

    .auth-form-input {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }

    .auth-form-input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .auth-form-input:focus {
      outline: none;
      background: rgba(255,255,255,0.1);
      border-color: var(--antique-gold);
      box-shadow: 0 0 0 3px rgba(196,169,98,0.15);
    }

    .auth-form-input.is-error {
      border-color: #e05c5c;
    }

    .auth-error-msg {
      display: none;
      font-size: 0.75rem;
      color: #e05c5c;
      margin-top: 0.4rem;
    }

    .auth-form-input.is-error + .auth-error-msg {
      display: block;
    }

    .auth-forgot {
      display: block;
      text-align: right;
      margin-top: -0.75rem;
      margin-bottom: 1.25rem;
      font-size: 0.78rem;
      color: rgba(196,169,98,0.8);
      text-decoration: none;
      transition: color 0.2s;
    }

    .auth-forgot:hover {
      color: var(--antique-gold);
    }

    .auth-submit-btn {
      width: 100%;
      padding: 0.9rem 1rem;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: var(--color-primary);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
      margin-top: 0.5rem;
    }

    .auth-submit-btn:hover {
      background: var(--color-primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(47,93,80,0.45);
    }

    .auth-submit-btn:active {
      transform: translateY(0);
    }

    .auth-separator {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .auth-separator::before,
    .auth-separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.12);
    }

    .auth-social-btns {
      display: flex;
      gap: 0.75rem;
    }

    .auth-social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.75rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: rgba(248,245,238,0.8);
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      text-decoration: none;
    }

    .auth-social-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.25);
      color: #fff;
    }

    .auth-footer-text {
      margin-top: 1.75rem;
      font-size: 0.85rem;
      color: rgba(248,245,238,0.55);
      text-align: center;
    }

    .auth-footer-text a {
      color: var(--antique-gold);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .auth-footer-text a:hover {
      color: #fff;
    }

    /* ── Floating auth page controls (theme/RTL toggles) ── */
    .auth-controls {
      position: fixed;
      top: 1rem;
      inset-inline-end: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 100;
    }

    .auth-ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(248, 245, 238, 0.85);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .auth-ctrl-btn:hover {
      background: rgba(196, 169, 98, 0.2);
      border-color: rgba(196, 169, 98, 0.5);
      color: #fff;
    }

    .auth-rtl-btn { width: auto; padding-inline: 0.75rem; }

    [data-theme="light"] .auth-theme-btn .icon-sun  { display: none; }
    [data-theme="light"] .auth-theme-btn .icon-moon { display: block; }
    [data-theme="dark"]  .auth-theme-btn .icon-moon { display: none; }
    [data-theme="dark"]  .auth-theme-btn .icon-sun  { display: block; }
  </style>
  <script src="../assets/js/theme.js"></script>
</head>

<main id="main-content">

  <!-- Floating Controls -->
  <div class="auth-controls" role="toolbar" aria-label="Page controls">
    <button class="auth-ctrl-btn auth-rtl-btn" id="rtlToggle" aria-label="Switch to RTL layout" title="Switch to right-to-left layout">
      <span>RTL</span>
    </button>
    <button class="auth-ctrl-btn auth-theme-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>
  <div class="auth-page-wrap">
    <div class="auth-inner">
      <div class="auth-card" role="main">

        <!-- Logo -->
        <a href="../index.html" class="auth-logo" aria-label="LeatherCraft Bindery — Home">
          <svg class="auth-logo-icon" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="4" y="6" width="5" height="32" rx="2" fill="#2F5D50"/>
            <rect x="9" y="4" width="28" height="36" rx="3" fill="#2F5D50" opacity="0.85"/>
            <rect x="9" y="4" width="5" height="36" fill="#1E3D34" opacity="0.4"/>
            <rect x="16" y="14" width="16" height="2" rx="1" fill="#C4A962"/>
            <rect x="16" y="20" width="12" height="1.5" rx="0.75" fill="#C4A962" opacity="0.7"/>
            <rect x="16" y="25" width="14" height="1.5" rx="0.75" fill="#C4A962" opacity="0.5"/>
          </svg>
          <span class="auth-logo-name">LeatherCraft</span>
        </a>

        <p class="auth-eyebrow">Welcome Back</p>
        <h1 class="auth-title">Sign In</h1>
        <p class="auth-subtitle">Access your orders, saved designs &amp; more.</p>
        <div class="auth-divider"></div>

        <!-- Social Login -->
        <div class="auth-social-btns">
          <a href="#" class="auth-social-btn" id="googleLoginBtn" aria-label="Continue with Google">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </a>
          <a href="#" class="auth-social-btn" id="facebookLoginBtn" aria-label="Continue with Facebook">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Facebook
          </a>
        </div>

        <div class="auth-separator">or continue with email</div>

        <!-- Login Form -->
        <form class="auth-form" id="loginForm" novalidate aria-label="Login form">
          <div class="auth-form-group">
            <label class="auth-form-label" for="loginEmail">Email Address</label>
            <input
              class="auth-form-input"
              type="email"
              id="loginEmail"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
            <span class="auth-error-msg" id="loginEmailErr" role="alert">Please enter a valid email address.</span>
          </div>

          <div class="auth-form-group">
            <label class="auth-form-label" for="loginPassword">Password</label>
            <input
              class="auth-form-input"
              type="password"
              id="loginPassword"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <span class="auth-error-msg" id="loginPasswordErr" role="alert">Password is required.</span>
          </div>

          <a href="#" class="auth-forgot" id="forgotPasswordLink">Forgot your password?</a>

          <button type="submit" class="auth-submit-btn" id="loginSubmitBtn">Sign In to My Account</button>
        </form>

        <p class="auth-footer-text">
          Don't have an account? <a href="signup.html">Create one — it's free</a>
        </p>

      </div>
    </div>
  </div>
</main>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
