<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — CHIC Boutique</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to CHIC Boutique's homepage to explore our collections and services.">
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%23D4AF37'/><path d='M50 15 L75 50 L50 85 L25 50 Z' fill='%230F0F0F'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    :root{--clr-primary:#0F0F0F;--clr-secondary:#D4AF37;--clr-pearl:#FAFAFA;--ff-heading:'Playfair Display',Georgia,serif;--ff-body:'Inter',system-ui,sans-serif;}
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--ff-body);
      background: var(--clr-primary);
      color: var(--clr-pearl);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      opacity: .12;
      z-index: 0;
    }
    .error-container {
      position: relative;
      z-index: 1;
      max-width: 620px;
    }
    .error-code {
      font-family: var(--ff-heading);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      line-height: 1;
      color: var(--clr-secondary);
      letter-spacing: -.02em;
      text-shadow: 0 0 80px rgba(212,175,55,.3);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .75; }
    }
    .error-brand {
      font-family: var(--ff-heading);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--clr-secondary);
      letter-spacing: .4em;
      text-transform: uppercase;
      margin: 1rem 0 .5rem;
    }
    .error-title {
      font-family: var(--ff-heading);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      color: var(--clr-pearl);
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .error-desc {
      font-size: 1rem;
      color: rgba(250,250,250,.7);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .error-divider {
      width: 60px;
      height: 2px;
      background: var(--clr-secondary);
      margin: 1.5rem auto;
    }
    .error-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .875rem 2rem;
      background: var(--clr-secondary);
      color: var(--clr-primary);
      font-family: var(--ff-body);
      font-size: .9375rem;
      font-weight: 600;
      letter-spacing: .03em;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      transition: transform .2s, opacity .2s;
      cursor: pointer;
    }
    .btn-primary:hover { transform: translateY(-2px); opacity: .9; }
    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .875rem 2rem;
      background: transparent;
      color: var(--clr-pearl);
      font-family: var(--ff-body);
      font-size: .9375rem;
      font-weight: 500;
      border: 1px solid rgba(250,250,250,.3);
      border-radius: 4px;
      text-decoration: none;
      transition: border-color .2s, background .2s;
    }
    .btn-outline:hover { border-color: var(--clr-secondary); background: rgba(212,175,55,.08); }
    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      justify-content: center;
      margin-top: 3rem;
      padding-top: 2.5rem;
      border-top: 1px solid rgba(250,250,250,.12);
    }
    .quick-links a {
      font-size: .875rem;
      color: rgba(250,250,250,.6);
      text-decoration: none;
      transition: color .2s;
    }
    .quick-links a:hover { color: var(--clr-secondary); }
    @media (prefers-reduced-motion: reduce) { .error-code { animation: none; } }
  </style>
</head>
<body>
  <main class="error-container" id="main-content" role="main">
    <div aria-hidden="true" class="error-code">404</div>
    <p class="error-brand">CHIC</p>
    <div class="error-divider" aria-hidden="true"></div>
    <h1 class="error-title">This Page Has Left the Building</h1>
    <p class="error-desc">The page you&rsquo;re looking for has moved, been renamed, or perhaps was never here to begin with. Let&rsquo;s get you back somewhere beautiful.</p>
    <div class="error-links">
      <a href="index.html" class="btn-primary">
        <i class="ph ph-house" aria-hidden="true"></i> Back to Home
      </a>
      <a href="contact.html" class="btn-outline">
        <i class="ph ph-envelope" aria-hidden="true"></i> Contact Us
      </a>
    </div>
    <nav class="quick-links" aria-label="Quick navigation links">
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="pricing.html">Pricing</a>
      <a href="blog.html">Journal</a>
      <a href="contact.html">Contact</a>
    </nav>
  </main>
</body>
</html>
