<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Oops! The page you're looking for doesn't exist. Return to PAWS Pet Shop homepage.">
  <title>Page Not Found | PAWS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36' fill='none' stroke='%23E07A5F' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='10' cy='8' r='4'/%3E%3Ccircle cx='26' cy='8' r='4'/%3E%3Ccircle cx='6' cy='20' r='3'/%3E%3Ccircle cx='30' cy='20' r='3'/%3E%3Cpath d='M18 32c-6 0-10-4-10-9 0-4 3-7 6-8 1.5-.5 3-.5 4 0 3 1 6 4 6 8 0 5-4 9-10 9z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    .page-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: var(--color-bg);
    }
    .standalone-toggles {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }
    .error-code-404 {
      font-size: 8rem;
      font-weight: 700;
      color: var(--color-primary);
      line-height: 1;
      margin: 30px 0 10px;
    }
    .error-title-404 {
      font-size: 2.5rem;
      margin-bottom: 15px;
    }
    .error-desc-404 {
      color: var(--color-text-muted);
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto 30px;
    }
    .error-actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .error-links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      max-width: 400px;
      margin: 0 auto 40px;
    }
    .error-links-grid a {
      display: block;
      padding: 15px;
      background: var(--color-surface);
      border-radius: 8px;
      text-decoration: none;
      color: var(--color-text);
      font-weight: 500;
      border: 1px solid var(--color-border);
      transition: all 0.3s ease;
    }
    .error-links-grid a:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="standalone-toggles">
    <button class="nav-action-btn theme-toggle" aria-label="Toggle theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="nav-action-btn rtl-toggle" aria-label="Toggle RTL">RTL</button>
  </div>

  <div class="page-404">
    <a href="index.html" class="nav-logo" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--color-text); font-size: 1.5rem; font-weight: 700;">
      <svg width="32" height="32" viewBox="0 0 36 36" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><circle cx="26" cy="8" r="4"/><circle cx="6" cy="20" r="3"/><circle cx="30" cy="20" r="3"/><path d="M18 32c-6 0-10-4-10-9 0-4 3-7 6-8 1.5-.5 3-.5 4 0 3 1 6 4 6 8 0 5-4 9-10 9z"/></svg>
      PAWS
    </a>
    
    <div class="error-code-404">404</div>
    <h2 class="error-title-404">Page Not Found</h2>
    <p class="error-desc-404">The page you're looking for has wandered off. Let's get you back on track!</p>
    
    <div class="error-actions">
      <a href="index.html" class="btn btn-primary">Go Home</a>
      <a href="shop.html" class="btn btn-outline">Browse Shop</a>
    </div>

    <div class="error-links-grid">
      <a href="categories.html">Categories</a>
      <a href="offers.html">Special Offers</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact Us</a>
    </div>

    <!-- Pet paw SVG illustration -->
    <svg width="120" height="120" viewBox="0 0 36 36" fill="none" stroke="var(--color-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5;">
      <circle cx="10" cy="8" r="4"/><circle cx="26" cy="8" r="4"/><circle cx="6" cy="20" r="3"/><circle cx="30" cy="20" r="3"/><path d="M18 32c-6 0-10-4-10-9 0-4 3-7 6-8 1.5-.5 3-.5 4 0 3 1 6 4 6 8 0 5-4 9-10 9z"/>
    </svg>
  </div>

  <script src="assets/js/animations.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/cart.js"></script>
</body>
</html>
