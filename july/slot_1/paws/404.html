<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAWS - Page Not Found</title>
  <meta name="description" content="Oops! The page you are looking for at PAWS does not exist. Let us help you find what you need.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>

<div class="toggles">
  <button class="rtl-toggle" aria-label="Switch to RTL">RTL</button>
  <button class="theme-toggle" aria-label="Switch to dark mode"></button>
</div>

<div class="page-404">
  <div class="error-code">404</div>
  <h1>Oops! Looks like this page ran away.</h1>
  <p style="color: var(--color-text-muted); margin-bottom: var(--space-xl); font-size: var(--fs-lg);">The page you are looking for might have been moved or does not exist.</p>

  <!-- Illustration -->
  <div class="illustration">
    <svg viewBox="0 0 250 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
      <circle cx="125" cy="100" r="80" fill="var(--color-surface)" stroke="var(--color-border)" stroke-width="2"/>
      <circle cx="100" cy="85" r="8" fill="var(--color-text)"/>
      <circle cx="150" cy="85" r="8" fill="var(--color-text)"/>
      <circle cx="102" cy="83" r="3" fill="#fff"/>
      <circle cx="152" cy="83" r="3" fill="#fff"/>
      <ellipse cx="125" cy="105" rx="10" ry="7" fill="var(--color-primary)"/>
      <path d="M115 115 Q125 125 135 115" stroke="var(--color-text)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M80 55 Q70 30 55 40" stroke="var(--color-text-muted)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M170 55 Q180 30 195 40" stroke="var(--color-text-muted)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="125" y="155" text-anchor="middle" fill="var(--color-text-muted)" font-family="var(--font-body)" font-size="12">?</text>
    </svg>
  </div>

  <!-- Search -->
  <div class="search-bar" style="margin-bottom: var(--space-xl);">
    <input type="text" placeholder="Search our site..." aria-label="Search">
    <button type="button">Search</button>
  </div>

  <!-- Quick Links -->
  <div class="error-links">
    <a href="index.html" class="btn btn-outline">Home</a>
    <a href="services.html" class="btn btn-outline">Services</a>
    <a href="blog.html" class="btn btn-outline">Blog</a>
    <a href="contact.html" class="btn btn-outline">Contact</a>
  </div>

  <!-- Help -->
  <p class="help-text">Need help? Our team is here for you at <a href="tel:5551237297">(555) 123-PAWS</a> or <a href="mailto:hello@paws.com">hello@paws.com</a>.</p>

  <!-- Take Me Home -->
  <a href="index.html" class="btn btn-primary btn-lg">Take Me Home</a>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
