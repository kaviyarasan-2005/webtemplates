<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%23222222'/%3E%3Ctext y='.9em' font-size='70' font-family='sans-serif' font-weight='700' fill='%23FACC15' x='50%25' text-anchor='middle' dominant-baseline='middle' dy='.1em'%3EA%3C/text%3E%3C/svg%3E">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXLE - Sign In</title>
  <meta name="description" content="Sign in to your AXLE account to manage appointments, vehicles, and service history.">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
<!-- TOGGLES -->
<div class="page-toggles">
  <button class="toggle-btn theme-toggle" aria-label="Toggle theme"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
  <button class="toggle-btn rtl-toggle" aria-label="RTL"><span class="toggle-label">LTR</span></button>
</div>

<!-- LOGIN CARD -->
<div class="auth-page">
  <!-- Login -->
  <div class="auth-card" id="loginCard">
    <div class="auth-brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none" width="40" height="40"><rect width="36" height="36" rx="8" fill="var(--secondary)"/><path d="M8 12h6v12H8zM14 12h3l3 6-3 6h-3l3-6-3-6zM22 12h6v3h-6v3h5v3h-5v3h6v3h-6v-12z" fill="var(--primary)"/></svg>
      <span>AXLE</span>
    </div>
    <h1>Welcome Back</h1>
    <button class="social-btn social-apple" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      Sign in with Apple
    </button>
    <button class="social-btn social-google" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Sign in with Google
    </button>
    <div class="auth-divider">OR</div>
    <form id="authForm">
      <div class="form-group"><label>Email</label><input type="email" class="form-input" placeholder="your@email.com" required><span class="form-error">Please enter a valid email</span></div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" class="form-input" placeholder="Enter your password" required>
          <button type="button" class="password-toggle" aria-label="Show password"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <span class="form-error">Password is required</span>
      </div>
      <div class="auth-extras">
        <label class="checkbox-wrap"><input type="checkbox"> Remember me</label>
        <a href="#">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
    </form>
    <div class="auth-footer">Don't have an account? <a href="signup.html">Sign Up</a></div>
  </div>
</div>

<script src="../assets/js/main.js"></script>
<script>
document.querySelectorAll('.password-toggle').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var input = this.previousElementSibling;
    if (input.type === 'password') { input.type = 'text'; this.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'; }
    else { input.type = 'password'; this.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'; }
  });
});
</script>
</body>
</html>
