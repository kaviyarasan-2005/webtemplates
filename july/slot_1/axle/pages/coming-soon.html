<body>

<div class="coming-soon">
  <div>
    <div class="brand-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none" width="56" height="56"><rect width="36" height="36" rx="8" fill="var(--secondary)"/><path d="M8 12h6v12H8zM14 12h3l3 6-3 6h-3l3-6-3-6zM22 12h6v3h-6v3h5v3h-5v3h6v3h-6v-12z" fill="var(--primary)"/></svg>

    <h1>We'll Be Back Soon</h1>
    <p>Our site is currently undergoing scheduled maintenance. We apologize for any inconvenience.</p>
    <div class="countdown">
      <div class="countdown-item"><span class="num" id="days">14</span><span class="label">Days</span></div>
      <div class="countdown-item"><span class="num" id="hours">08</span><span class="label">Hours</span></div>
      <div class="countdown-item"><span class="num" id="mins">32</span><span class="label">Minutes</span></div>
      <div class="countdown-item"><span class="num" id="secs">15</span><span class="label">Seconds</span></div>
    </div>
    <form class="notify-form">
      <input type="email" class="form-input" placeholder="Enter your email" required>
      <button type="submit" class="btn btn-primary">Notify Me</button>
    </form>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script>
(function(){
  var end = Date.now() + 14*24*60*60*1000;
  function update(){
    var s = Math.max(0, Math.floor((end - Date.now())/1000));
    document.getElementById('days').textContent = String(Math.floor(s/86400)).padStart(2,'0');
    document.getElementById('hours').textContent = String(Math.floor((s%86400)/3600)).padStart(2,'0');
    document.getElementById('mins').textContent = String(Math.floor((s%3600)/60)).padStart(2,'0');
    document.getElementById('secs').textContent = String(s%60).padStart(2,'0');
    requestAnimationFrame(update);
  }
  update();
})();
</script>
</body>
</html>
