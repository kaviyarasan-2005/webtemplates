<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found – VisionCare Optical. The page you're looking for doesn't exist. Return to our home page or explore our eye care services.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <title>404 – Page Not Found | VisionCare Optical</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/utilities.css">
  <script src="../assets/js/theme.js"></script>
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: var(--nav-height);
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
    }
    .error-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--color-primary-subtle) 0%, var(--bg-primary) 60%, var(--color-secondary-subtle) 100%);
    }
    .error-content {
      position: relative;
      text-align: center;
      max-width: 600px;
      padding: var(--space-8);
    }
    .error-number {
      font-family: var(--font-display);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: var(--font-extrabold);
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: var(--space-4);
      animation: fadeInDown 0.8s ease;
    }
    .error-icon {
      font-size: 4rem;
      color: var(--color-primary);
      opacity: 0.3;
      margin-bottom: var(--space-6);
      animation: float 4s ease-in-out infinite;
      display: block;
    }
    .error-title {
      font-size: clamp(var(--text-2xl), 4vw, var(--text-4xl));
      color: var(--text-primary);
      margin-bottom: var(--space-4);
      animation: fadeInUp 0.8s ease 0.2s both;
    }
    .error-text {
      font-size: var(--text-lg);
      color: var(--text-secondary);
      line-height: var(--leading-relaxed);
      margin-bottom: var(--space-8);
      animation: fadeInUp 0.8s ease 0.4s both;
    }
    .error-actions {
      display: flex;
      gap: var(--space-4);
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeInUp 0.8s ease 0.6s both;
    }
    .error-links {
      margin-top: var(--space-10);
      animation: fadeInUp 0.8s ease 0.8s both;
    }
    .error-links p {
      font-size: var(--text-sm);
      color: var(--text-muted);
      margin-bottom: var(--space-4);
    }
    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      justify-content: center;
    }
    .quick-link {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      text-decoration: none;
      transition: all var(--transition-fast);
    }
    .quick-link:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background: var(--color-primary-subtle);
    }
    .quick-link i { font-size: var(--text-xs); }
  </style>
</head>
<body>

<main id="main-content">

  <!-- Minimal Nav -->
  <header style="position:fixed;top:0;left:0;right:0;height:var(--nav-height);background:var(--bg-nav);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-color);z-index:var(--z-sticky);display:flex;align-items:center;padding-inline:var(--space-6);" role="banner">
    <a href="../index.html" style="display:flex;align-items:center;gap:var(--space-3);text-decoration:none;" aria-label="VisionCare Optical – Home">
      <div style="width:36px;height:36px;background:linear-gradient(135deg,var(--color-primary),var(--color-secondary));border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:white;" aria-hidden="true">
        <img src="../assets/images/favicon.png" alt="Optic Logo" class="logo-icon-img">
      </div>
      <span style="font-family:var(--font-display);font-size:var(--text-lg);font-weight:var(--font-bold);color:var(--text-primary);">VisionCare</span>
    </a>
    <div style="margin-left:auto;display:flex;gap:var(--space-2);">
      <button class="toggle-btn" data-theme-toggle aria-label="Toggle theme">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
        <span class="toggle-label">Dark</span>
      </button>
      <button class="toggle-btn" data-dir-toggle aria-label="Toggle direction">
        <span class="toggle-label">RTL</span>
      </button>
    </div>
  </header>

  <div class="error-page">
    <div class="error-bg" aria-hidden="true"></div>
    <div class="error-content" role="main">

      <i class="fa-solid fa-glasses error-icon" aria-hidden="true"></i>

      <div class="error-number" role="text" aria-label="Error 404">404</div>

      <h1 class="error-title">Page Out of Focus</h1>
      <p class="error-text">
        It seems the page you are looking for has moved, was removed, or perhaps never existed.
        Let us help you find your way back to clear vision.
      </p>

      <div class="error-actions">
        <a href="../index.html" class="btn btn-primary btn-lg">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
          Back to Home
        </a>
        <a href="../pages/contact.html" class="btn btn-outline btn-lg">
          <i class="fa-solid fa-envelope" aria-hidden="true"></i>
          Contact Us
        </a>
      </div>

      <div class="error-links">
        <p>Or explore these popular pages:</p>
        <div class="quick-links">
          <a href="../pages/service.html" class="quick-link">
            <i class="fa-solid fa-stethoscope" aria-hidden="true"></i>
            Services
          </a>
          <a href="../pages/pricing.html" class="quick-link">
            <i class="fa-solid fa-tags" aria-hidden="true"></i>
            Pricing
          </a>
          <a href="../pages/about.html" class="quick-link">
            <i class="fa-solid fa-building" aria-hidden="true"></i>
            About Us
          </a>
          <a href="../pages/blog.html" class="quick-link">
            <i class="fa-solid fa-newspaper" aria-hidden="true"></i>
            Blog
          </a>
          <a href="../pages/contact.html#appointment" class="quick-link">
            <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
            Book Eye Test
          </a>
        </div>
      </div>

    </div>
  </div>

</main>

<script src="../assets/js/main.js"></script>
</body>
</html>
