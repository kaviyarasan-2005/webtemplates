<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Gift Joy</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background-color: var(--clr-lavender); color: white;">

    <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: var(--space-16) 0;">
        <div class="container flex flex-col items-center">
            <div style="font-size: 5rem; margin-bottom: var(--space-6);">
                <i class="ph-duotone ph-package"></i>
            </div>
            <h1 style="color: white; margin-bottom: var(--space-4);">Something Special is Coming</h1>
            <p style="max-width: 500px; margin-bottom: var(--space-8); opacity: 0.9; font-size: 1.125rem;">We're working hard to bring you a new feature. Leave your email below to be notified when it launches.</p>
            
            <form action="#" class="flex gap-2" style="width: 100%; max-width: 400px; margin-bottom: var(--space-8);">
                <input type="email" placeholder="Enter your email" class="form-control" style="background: white; color: var(--clr-text-main); border: none;" required>
                <button type="submit" class="btn btn-secondary">Notify Me</button>
            </form>
            
            <a href="../index.html" class="btn btn-outline" style="color: white; border-color: white;">Back to Home</a>
        </div>
    </main>

    <!-- Custom JS (Only for theme persistence if needed) -->
    <script src="../assets/js/main.js"></script>

</html>
