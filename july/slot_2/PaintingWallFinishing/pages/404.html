<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — Pulse. The page you're looking for doesn't exist. Return to our homepage or search for what you need.">
  <title>404 — Page Not Found | Pulse</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
  <script>(function(){const t=localStorage.getItem('Pulse-theme');const d=localStorage.getItem('Pulse-dir');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t));else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark');if(d){const dir=JSON.parse(d);document.documentElement.setAttribute('dir',dir);document.documentElement.setAttribute('lang',dir==='rtl'?'ar':'en');}})();</script>
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="page-content not-found-page" id="main-content">
    <div style="max-width:600px;width:100%;text-align:center;">
      <div class="not-found-icon" aria-hidden="true"><i class="fas fa-triangle-exclamation"></i></div>
      <div class="not-found-number" aria-label="Error 404">404</div>
      <h1 style="font-size:var(--fs-2xl);color:var(--clr-text);margin-bottom:var(--sp-3);">Page Not Found</h1>
      <p style="color:var(--clr-text-secondary);font-size:var(--fs-md);line-height:var(--lh-relaxed);margin-bottom:var(--sp-8);">
        The page you're looking for seems to have been moved, renamed, or doesn't exist. Let's get you back on track.
      </p>

      <!-- Search -->
      <div style="margin-bottom:var(--sp-8);" role="search" aria-label="Search the website">
        <div class="search-bar" style="max-width:400px;margin:0 auto;">
          <input type="search" class="search-bar__input" placeholder="Search medicines, services..." aria-label="Search for medicines or services">
          <button class="search-bar__btn" aria-label="Search"><i class="fas fa-magnifying-glass" aria-hidden="true"></i></button>
        </div>
      </div>

      <div style="display:flex;gap:var(--sp-3);justify-content:center;flex-wrap:wrap;margin-bottom:var(--sp-10);">
        <a href="../index.html" class="btn btn--primary btn--lg" aria-label="Return to Pulse homepage">
          <i class="fas fa-house" aria-hidden="true"></i> Go to Homepage
        </a>
        <a href="../pages/contact.html" class="btn btn--outline btn--lg" aria-label="Contact our support team">
          <i class="fas fa-headset" aria-hidden="true"></i> Contact Support
        </a>
      </div>

      <!-- Quick links -->
      <div>
        <p style="font-size:var(--fs-sm);color:var(--clr-text-muted);margin-bottom:var(--sp-4);">You might be looking for:</p>
        <div style="display:flex;gap:var(--sp-2);justify-content:center;flex-wrap:wrap;">
          <a href="../index.html#rx-upload" class="badge badge--primary" style="padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);">Upload Prescription</a>
          <a href="./service.html" class="badge badge--secondary" style="padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);">Our Services</a>
          <a href="./about.html" class="badge badge--neutral" style="padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);">About Us</a>
          <a href="./blog.html" class="badge badge--primary" style="padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);">Health Blog</a>
          <a href="./pricing.html" class="badge badge--secondary" style="padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);">Pricing</a>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script type="module" src="../js/components.js"></script>
  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/nav.js"></script>
</body>
</html>
