<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Something amazing is coming to Pulse. New services, new cities. Stay tuned!">
  <title>Coming Soon — Pulse</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
  <script>(function(){const t=localStorage.getItem('Pulse-theme');const d=localStorage.getItem('Pulse-dir');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t));else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark');if(d){const dir=JSON.parse(d);document.documentElement.setAttribute('dir',dir);document.documentElement.setAttribute('lang',dir==='rtl'?'ar':'en');}})();</script>
</head>
<body>
  <main class="coming-soon-page" id="main-content" data-countdown="2026-12-01T00:00:00">
    <div class="coming-soon-content">
      <!-- Logo -->
      <a href="../index.html" class="auth-brand-logo" style="justify-content:center;margin-bottom:var(--sp-8);text-decoration:none;" aria-label="Pulse Home">
        <div class="auth-brand-logo__icon" aria-hidden="true"><i class="fas fa-cross"></i></div>
        <span class="auth-brand-logo__text" style="color:#fff;">Pulse</span>
      </a>

      <div class="section-tag" style="justify-content:center;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:var(--clr-primary-light);">
        <i class="fas fa-rocket" aria-hidden="true"></i>
        Something Exciting is Coming
      </div>

      <h1 style="font-family:var(--font-display);font-size:clamp(2rem,5vw,3.5rem);color:#fff;margin:var(--sp-5) 0;line-height:1.2;">
        We're Launching in<br><span style="background:linear-gradient(135deg,var(--clr-primary-light),var(--clr-secondary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">New Cities</span>
      </h1>

      <p style="color:rgba(255,255,255,0.7);font-size:var(--fs-md);line-height:var(--lh-relaxed);max-width:480px;margin:0 auto;">
        Pulse is expanding to 30 new cities across India. Faster delivery, more products, better care — coming December 2026.
      </p>

      <!-- Countdown Timer -->
      <div class="countdown-grid" aria-label="Countdown to launch" role="timer">
        <div class="countdown-item">
          <div class="countdown-number" id="countdownDays" aria-label="Days">00</div>
          <div class="countdown-label">Days</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="countdownHours" aria-label="Hours">00</div>
          <div class="countdown-label">Hours</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="countdownMins" aria-label="Minutes">00</div>
          <div class="countdown-label">Mins</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="countdownSecs" aria-label="Seconds">00</div>
          <div class="countdown-label">Secs</div>
        </div>
      </div>

      <!-- Email capture — ConvertKit/Mailchimp integration point -->
      <form aria-label="Early access notification form" style="max-width:420px;margin:0 auto;" id="comingSoonForm">
        <p style="color:rgba(255,255,255,0.65);font-size:var(--fs-sm);margin-bottom:var(--sp-4);">Get notified when we launch in your city.</p>
        <div style="display:flex;gap:var(--sp-2);">
          <input type="email" name="email" class="footer__newsletter-input" placeholder="Enter your email address" aria-label="Email address for launch notification" required style="flex:1;">
          <button type="submit" class="btn btn--primary" aria-label="Subscribe for launch notification">
            <i class="fas fa-paper-plane" aria-hidden="true"></i> Notify Me
          </button>
        </div>
      </form>

      <!-- Social -->
      <div style="display:flex;gap:var(--sp-3);justify-content:center;margin-top:var(--sp-8);">
        <a href="#" class="footer__social-link" aria-label="Pulse on Facebook"><i class="fab fa-facebook-f" aria-hidden="true"></i></a>
        <a href="#" class="footer__social-link" aria-label="Pulse on Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a>
        <a href="#" class="footer__social-link" aria-label="Pulse on X/Twitter"><i class="fab fa-x-twitter" aria-hidden="true"></i></a>
        <a href="#" class="footer__social-link" aria-label="Pulse on WhatsApp"><i class="fab fa-whatsapp" aria-hidden="true"></i></a>
      </div>

      <div style="margin-top:var(--sp-8);">
        <a href="../index.html" style="color:rgba(255,255,255,0.5);font-size:var(--fs-sm);text-decoration:none;display:flex;align-items:center;gap:var(--sp-2);justify-content:center;" aria-label="Return to current Pulse website">
          <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Current Site
        </a>
      </div>
    </div>
  </main>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/animations.js"></script>
  <script>
    document.getElementById('comingSoonForm')?.addEventListener('submit', function(e) {
      e.preventDefault();
      const email = this.querySelector('input[type="email"]').value;
      if (email) {
        // ConvertKit/Mailchimp integration point
        // fetch('https://api.convertkit.com/...', {...})
        import('../js/utils.js').then(({ showToast }) => {
          showToast('You\'re on the list! We\'ll notify you when we launch.', 'success');
        });
        this.reset();
      }
    });
  </script>
</body>
</html>
