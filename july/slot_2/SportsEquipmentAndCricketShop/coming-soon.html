<body style="margin: 0; padding: 0;">

  <main id="main-content" class="page-coming-soon" style="background-image: url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1200&q=80');">
    <div class="logo">
      <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" width="48" height="48" style="color: var(--color-accent);"><path d="M232,64H208V48a8,8,0,0,0-8-8H56a8,8,0,0,0-8,8V64H24A16,16,0,0,0,8,80v8a56.06,56.06,0,0,0,48.44,55.47A39.8,39.8,0,0,0,88,176v24H72a8,8,0,0,0,0,16H184a8,8,0,0,0,0-16H168V176a39.8,39.8,0,0,0,31.56-32.53A56.06,56.06,0,0,0,248,88V80A16,16,0,0,0,232,64Zm0,24a40.06,40.06,0,0,1-24.67,37A8,8,0,0,0,200,128a24,24,0,0,1-24-24V56h16V80a8,8,0,0,0,8,8h32ZM152,176v24H104V176a24,24,0,0,1,24-24h0A24,24,0,0,1,152,176ZM64,128V56H192v48a40,40,0,0,1-40,40H104A40,40,0,0,1,64,128ZM24,88V80H48v48a40.5,40.5,0,0,0,.67,7.3A40.06,40.06,0,0,1,24,88Z"/></svg>
      <span style="font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: 700; letter-spacing: 0.05em; color: #FFFFFF;">PLAY</span>
    </div>

    <h1>New Season Gear Arriving Soon</h1>
    <p class="subtitle">We are preparing our new inventory lines and team kit custom builders. Sign up below to get early discount codes.</p>

    <!-- Countdown Timer -->
    <div class="countdown" id="countdownTimer">
      <div class="countdown-item">
        <div class="countdown-value" id="days">30</div>
        <div class="countdown-label">Days</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-value" id="hours">00</div>
        <div class="countdown-label">Hours</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-value" id="minutes">00</div>
        <div class="countdown-label">Mins</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-value" id="seconds">00</div>
        <div class="countdown-label">Secs</div>
      </div>
    </div>

    <!-- Email Sign Up -->
    <form class="inline-form" id="comingSoonForm" onsubmit="return false;" style="margin-bottom: var(--space-8);">
      <input type="email" class="form-input" placeholder="Enter your email address" required style="background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); color: #fff;">
      <button type="submit" class="btn btn-accent">Notify Me</button>
    </form>
    
    <div id="comingSoonSuccess" style="display: none; color: var(--color-accent); font-weight: 600; margin-bottom: var(--space-6);">
      ✓ You have been subscribed! We will alert you on launch.
    </div>

    <!-- Social Links -->
    <div class="footer-social" style="justify-content: center; gap: var(--space-4);">
      <a href="#" aria-label="Facebook" style="background: rgba(255,255,255,0.1); color: #fff; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%;"><svg width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm8,191.63V152h24a8,8,0,0,0,0-16H136V112a16,16,0,0,1,16-16h16a8,8,0,0,0,0-16H152a32,32,0,0,0-32,32v24H96a8,8,0,0,0,0,16h24v63.63a88,88,0,1,1,16,0Z"/></svg></a>
      <a href="#" aria-label="Instagram" style="background: rgba(255,255,255,0.1); color: #fff; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%;"><svg width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160ZM176,24H80A56.06,56.06,0,0,0,24,80v96a56.06,56.06,0,0,0,56,56h96a56.06,56.06,0,0,0,56-56V80A56.06,56.06,0,0,0,176,24Zm40,152a40,40,0,0,1-40,40H80a40,40,0,0,1-40-40V80A40,40,0,0,1,80,40h96a40,40,0,0,1,40,40ZM192,76a12,12,0,1,1-12-12A12,12,0,0,1,192,76Z"/></svg></a>
      <a href="#" aria-label="Twitter" style="background: rgba(255,255,255,0.1); color: #fff; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%;"><svg width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M214.75,211.71l-62.6-98.38,61.77-67.95a8,8,0,0,0-11.84-10.76L143.22,99.32,102.75,35.71A8,8,0,0,0,96,32H48a8,8,0,0,0-6.75,12.29l62.6,98.38L41.08,210.62a8,8,0,1,0,11.84,10.76l58.86-64.72,40.47,63.63A8,8,0,0,0,160,224h48a8,8,0,0,0,6.75-12.29ZM164.39,208,69.75,59.69,91.61,48h0L186.25,196.31Z"/></svg></a>
    </div>
  </main>

  <script>
    // Countdown Timer logic: Target is 30 days from load date to ensure live look
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 30);

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate.getTime() - now;

      if (difference <= 0) {
        document.getElementById('countdownTimer').innerHTML = "<h3>We are live!</h3>";
        return;
      }

      const d = Math.floor(difference / (1000 * 60 * 60 * 24));
      const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = d < 10 ? '0' + d : d;
      document.getElementById('hours').textContent = h < 10 ? '0' + h : h;
      document.getElementById('minutes').textContent = m < 10 ? '0' + m : m;
      document.getElementById('seconds').textContent = s < 10 ? '0' + s : s;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Notify Form submit
    const csForm = document.getElementById('comingSoonForm');
    if (csForm) {
      csForm.addEventListener('submit', (e) => {
        e.preventDefault();
        document.getElementById('comingSoonSuccess').style.display = 'block';
        csForm.reset();
        setTimeout(() => {
          document.getElementById('comingSoonSuccess').style.display = 'none';
        }, 5000);
      });
    }
  </script>
</body>
</html>
