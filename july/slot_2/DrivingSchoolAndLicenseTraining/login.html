<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRIV — Sign In to Student & Admin Portal</title>
  <meta name="description"
    content="Access your DRIV account. Log in to your student dashboard to schedule lessons or view your progress reports.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF6B35' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'%3E%3C/circle%3E%3Ccircle cx='12' cy='12' r='3'%3E%3C/circle%3E%3Cpath d='M12 2v7'%3E%3C/path%3E%3Cpath d='M12 15v7'%3E%3C/path%3E%3Cpath d='M2 12h7'%3E%3C/path%3E%3Cpath d='M15 12h7'%3E%3C/path%3E%3C/svg%3E">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <!-- Skip Link for Accessibility -->
  <a href="#login-form-container" class="skip-link">Skip to login form</a>

  <!-- Top-Right Actions (For LTR/RTL and Dark Mode toggle) -->
  <div class="auth-toggles">
    <button class="navbar__rtl-btn rtl-toggle" aria-label="Toggle language direction">RTL</button>
    <button class="navbar__toggle-btn theme-toggle" aria-label="Toggle dark mode"
      style="color:var(--color-primary); background:var(--bg-card); border:1px solid var(--border-color); border-radius: 6px;">
      <i data-lucide="moon"></i>
    </button>
  </div>

  <main class="auth-layout" id="login-form-container">

    <!-- Login Form -->
    <section class="auth-panel auth-panel--form" aria-labelledby="form-title">
      <div class="auth-card fade-in">

        <!-- Brand Logo -->
        <a href="index.html" class="auth-card__logo" aria-label="Go to DRIV Homepage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" style="color: var(--color-primary);">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2v7"></path>
            <path d="M12 15v7"></path>
            <path d="M2 12h7"></path>
            <path d="M15 12h7"></path>
          </svg>
          <span>DRIV</span>
        </a>

        <h2 id="form-title" class="auth-card__title">Sign In</h2>
        <p class="auth-card__subtitle">Access your student portal or admin operations dashboard.</p>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@example.com"
              autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="login-password" class="form-control" placeholder="••••••••"
                autocomplete="current-password" required>
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group flex flex--between" style="margin-top: var(--space-4);">
            <div class="checkbox-group">
              <input type="checkbox" id="login-remember">
              <label for="login-remember">Remember me</label>
            </div>
            <a href="#"
              style="font-size: var(--fs-xs); color: var(--color-primary); font-weight: var(--fw-semibold);">Forgot
              Password?</a>
          </div>

          <button type="submit" class="btn btn--primary btn--full" style="margin-top:var(--space-4);">Sign In</button>
        </form>

        <div class="divider-or">OR CONTINUE WITH</div>

        <!-- Social Login -->
        <div class="social-login">
          <button class="social-btn social-btn--google">
            <svg viewBox="0 0 24 24" style="width:18px; height:18px;">
              <path fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
              <path fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Google
          </button>

          <button class="social-btn social-btn--apple">
            <svg viewBox="0 0 24 24" style="width:18px; height:18px; fill:currentColor;">
              <path
                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.22.67-2.94 1.51-.64.74-1.2 1.88-1.05 2.99 1.12.09 2.27-.58 3-1.44z" />
            </svg>
            Apple
          </button>
        </div>

        <div class="auth-card__footer">
          Don't have an account? <a href="register.html">Sign Up</a>
        </div>

      </div>
    </section>

  </main>

  <!-- JavaScript Modules -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>

</html>
