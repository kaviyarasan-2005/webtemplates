<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRIV — Page Not Found (404 Error)</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF6B35' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'%3E%3C/circle%3E%3Ccircle cx='12' cy='12' r='3'%3E%3C/circle%3E%3Cpath d='M12 2v7'%3E%3C/path%3E%3Cpath d='M12 15v7'%3E%3C/path%3E%3Cpath d='M2 12h7'%3E%3C/path%3E%3Cpath d='M15 12h7'%3E%3C/path%3E%3C/svg%3E">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="overflow:hidden;">

  <!-- Skip Link for Accessibility -->
  <a href="#error-main" class="skip-link">Skip to error information</a>

  <!-- Top-Right Actions -->
  <div class="auth-toggles">
    <button class="navbar__rtl-btn rtl-toggle" aria-label="Toggle language direction" style="border-color: rgba(255,255,255,0.2); color:var(--text-muted);">RTL</button>
    <button class="navbar__toggle-btn theme-toggle" aria-label="Toggle dark mode" style="color:var(--color-primary); background:rgba(255,255,255,0.05); border-radius: 6px;">
      <i data-lucide="moon"></i>
    </button>
  </div>

  <main class="utility-page" id="error-main">
    
    <!-- Background wrong way road sign -->
    <div class="utility-page__bg">
      <img src="https://images.unsplash.com/photo-1579618210881-266b26d973ee?w=1280&q=80&fm=webp" alt="Wrong way road sign in foggy background">
    </div>
    
    <div class="utility-page__content fade-in">
      <div class="error-code">404</div>
      <h2 style="font-size: var(--fs-h2); margin-bottom: var(--space-3);">Page Not Found</h2>
      <p style="color: var(--text-secondary); max-width: 480px; margin: 0 auto var(--space-8); line-height: 1.6;">The page you are looking for doesn't exist, has been removed, or is temporarily unavailable under active maintenance schedules.</p>
      
      <!-- Center navigation home -->
      <a href="index.html" class="btn btn--primary btn--lg"><i data-lucide="home"></i> Back to Home</a>
    </div>

  </main>

  <!-- JavaScript Modules -->
  <script src="assets/js/main.js"></script>
</body>
</html>
