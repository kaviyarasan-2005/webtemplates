<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRIV — System Upgrading (Coming Soon)</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF6B35' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'%3E%3C/circle%3E%3Ccircle cx='12' cy='12' r='3'%3E%3C/circle%3E%3Cpath d='M12 2v7'%3E%3C/path%3E%3Cpath d='M12 15v7'%3E%3C/path%3E%3Cpath d='M2 12h7'%3E%3C/path%3E%3Cpath d='M15 12h7'%3E%3C/path%3E%3C/svg%3E">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body style="overflow:hidden;">

  <!-- Skip Link for Accessibility -->
  <a href="#coming-soon-main" class="skip-link">Skip to countdown timer</a>

  <!-- Top-Right Actions -->
  <div class="auth-toggles">
    <button class="navbar__rtl-btn rtl-toggle" aria-label="Toggle language direction"
      style="border-color: rgba(255,255,255,0.2); color:var(--text-muted);">RTL</button>
    <button class="navbar__toggle-btn theme-toggle" aria-label="Toggle dark mode"
      style="color:var(--color-primary); background:rgba(255,255,255,0.05); border-radius: 6px;">
      <i data-lucide="moon"></i>
    </button>
  </div>

  <main class="utility-page" id="coming-soon-main">

    <!-- Background auto workshop garage dark -->
    <div class="utility-page__bg">
      <img src="https://images.unsplash.com/photo-1517524206127-48bbd363f3d7?w=1280&q=80&fm=webp"
        alt="Dark auto mechanic garage facility background">
    </div>

    <div class="utility-page__content fade-in">
      <h1 style="color:var(--color-white); font-size: var(--fs-h1); margin-bottom: var(--space-4);">We're Upgrading Our
        Fleet</h1>
      <p style="color: rgba(255,255,255,0.8); max-width: 480px; margin: 0 auto var(--space-8); line-height: 1.6;">Our
        operations site is undergoing scheduled database maintenance to register new dual-control safety cars. We'll be
        back online shortly.</p>

      <!-- Countdown timer -->
      <div class="countdown">
        <div class="countdown__card">
          <div class="countdown__value" id="days">02</div>
          <span class="countdown__label">Days</span>
        </div>
        <div class="countdown__card">
          <div class="countdown__value" id="hours">14</div>
          <span class="countdown__label">Hours</span>
        </div>
        <div class="countdown__card">
          <div class="countdown__value" id="minutes">45</div>
          <span class="countdown__label">Mins</span>
        </div>
        <div class="countdown__card">
          <div class="countdown__value" id="seconds">30</div>
          <span class="countdown__label">Secs</span>
        </div>
      </div>

      <!-- Subscription form -->
      <form class="newsletter-form" style="margin: 0 auto; max-width: 420px;" id="soon-notify-form">
        <input type="email" class="form-control" placeholder="Enter your email address" aria-label="Email address"
          required style="background: rgba(0,0,0,0.5); border-color: rgba(255,255,255,0.2); color:white;">
        <button type="submit" class="btn btn--primary">Notify Me</button>
      </form>
      <div id="soon-notify-alert"
        style="display:none; color:var(--color-success); font-size:14px; font-weight:500; text-align:center; margin-top:16px;">
        Notification registered! We will email you on launch.
      </div>
    </div>

  </main>

  <!-- JavaScript Modules -->
  <script src="assets/js/main.js"></script>

  <script>
    // Set coming soon countdown timer (e.g. 3 days from now)
    const targetDate = new Date().getTime() + (3 * 24 * 60 * 60 * 1000);

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        clearInterval(timerInterval);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    const timerInterval = setInterval(updateCountdown, 1000);
    updateCountdown();

    // Subscribe form notify handler
    const form = document.getElementById('soon-notify-form');
    const alertBox = document.getElementById('soon-notify-alert');
    if (form && alertBox) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        alertBox.style.display = 'block';
        form.reset();
        setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
      });
    }
  </script>
</body>

</html>
