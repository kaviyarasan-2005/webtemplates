<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASH - Coming Soon | Something Fresh is Brewing</title>
  <meta name="description" content="WASH laundry and dry cleaning services are launching soon. Subscribe to be notified and get 20% off your first pickup.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="coming-soon-page">
  <main class="coming-soon">
    <!-- Coming Soon Background Image -->
    <div class="coming-soon__bg">
      <img src="https://images.unsplash.com/photo-1545173168-9f1947eebb7f?auto=format&fit=crop&w=1200&q=80" alt="Premium laundry drying machines layout" loading="eager">
    </div>
    <div class="coming-soon__overlay"></div>

    <!-- Theme & RTL Toggles -->
    <div class="coming-soon__toggles">
      <button class="rtl-toggle toggle-btn" aria-label="Toggle text direction" title="Toggle RTL/LTR">RTL</button>
      <button class="theme-toggle toggle-btn" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
    </div>

    <!-- Coming Soon Content -->
    <div class="coming-soon__content">
      <a href="index.html" style="margin-bottom: var(--space-4); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" stroke="#D48C2E" stroke-width="2.5" fill="none"/>
          <path d="M20 8C20 8 14 16 14 22C14 25.3137 16.6863 28 20 28C23.3137 28 26 25.3137 26 22C26 16 20 8 20 8Z" fill="#D48C2E"/>
        </svg>
        <span style="font-family: var(--font-heading); font-size: 1.75rem; font-weight: var(--fw-bold); color: var(--color-text-inverse);">WASH</span>
      </a>

      <h1 class="coming-soon__title">Something Fresh is Coming</h1>
      <p class="coming-soon__text">
        We are crafting the ultimate premium laundry and dry cleaning experience. Subscribe below to receive launch alerts and exclusive first-time customer discounts.
      </p>

      <!-- Countdown Container -->
      <div class="countdown" data-target="2026-12-31T00:00:00">
        <div class="countdown__item">
          <div class="countdown__number" data-days>00</div>
          <span class="countdown__label">Days</span>
        </div>
        <div class="countdown__item">
          <div class="countdown__number" data-hours>00</div>
          <span class="countdown__label">Hours</span>
        </div>
        <div class="countdown__item">
          <div class="countdown__number" data-minutes>00</div>
          <span class="countdown__label">Mins</span>
        </div>
        <div class="countdown__item">
          <div class="countdown__number" data-seconds>00</div>
          <span class="countdown__label">Secs</span>
        </div>
      </div>

      <!-- Newsletter Form -->
      <form class="newsletter" data-validate style="max-width: 480px; margin: 0 auto;">
        <div class="form-group">
          <div class="newsletter__form" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: var(--radius-lg); overflow: hidden; padding: 4px;">
            <input type="email" name="email" class="form-input" placeholder="Enter your email address" required aria-label="Email for launch alert" style="background: transparent; border: none; color: var(--color-text-inverse); width: 100%; padding: 0.6rem 1rem;">
            <button type="submit" class="btn btn--primary" style="flex-shrink: 0; white-space: nowrap;">Notify Me</button>
          </div>
        </div>
        <p class="form-success" style="display:none;color:var(--color-success);font-size:var(--small-size);margin-top:10px;">You have been subscribed successfully! We will email you with details.</p>
      </form>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
