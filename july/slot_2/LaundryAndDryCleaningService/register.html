<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASH - Register | Laundry & Dry Cleaning</title>
  <meta name="description" content="Create your WASH account to schedule pickups, save addresses, view spending charts, and unlock premium laundry packages.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    .password-strength {
      margin-top: 8px;
      height: 6px;
      background: var(--color-border);
      border-radius: var(--radius-xs);
      position: relative;
      overflow: visible;
    }
    .password-strength__fill {
      height: 100%;
      width: 0;
      border-radius: var(--radius-xs);
      transition: all var(--transition-fast);
    }
    .password-strength__label {
      position: absolute;
      right: 0;
      top: 8px;
      font-size: var(--xs-size);
      font-weight: var(--fw-semibold);
    }
  </style>
</head>
<body class="auth-page-body">
  <main class="auth-page">
    <!-- Theme & RTL Actions -->
    <div class="auth-toggles">
      <button class="rtl-toggle toggle-btn" aria-label="Toggle text direction" title="Toggle RTL/LTR">RTL</button>
      <button class="theme-toggle toggle-btn" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
    </div>

    <!-- Centered Card -->
    <div class="auth-card">
      <div class="auth-form-container">
        <div class="auth-form__header">
          <a href="index.html" class="auth-form__logo">
            <svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="20" cy="20" r="18" stroke="#D48C2E" stroke-width="2.5" fill="none"/>
              <path d="M20 8C20 8 14 16 14 22C14 25.3137 16.6863 28 20 28C23.3137 28 26 25.3137 26 22C26 16 20 8 20 8Z" fill="#D48C2E"/>
            </svg>
            <span class="auth-form__logo-text">WASH</span>
          </a>
          <h1 class="auth-form__title">Create Account</h1>
          <p class="auth-form__subtitle">Join us for fresh laundry delivered directly to your doorstep.</p>
        </div>

        <form id="registerForm" data-validate>
          <div class="form-group">
            <label for="register-name" class="form-label">Full Name</label>
            <input type="text" id="register-name" name="fullName" class="form-input" required placeholder="John Doe">
            <span class="form-error" style="display:none;color:var(--color-error);font-size:var(--small-size);margin-top:4px;">Please enter your name</span>
          </div>

          <div class="form-group" style="margin-top: var(--space-2);">
            <label for="register-email" class="form-label">Email Address</label>
            <input type="email" id="register-email" name="email" class="form-input" required placeholder="name@example.com">
            <span class="form-error" style="display:none;color:var(--color-error);font-size:var(--small-size);margin-top:4px;">Please enter a valid email address</span>
          </div>

          <div class="form-group" style="margin-top: var(--space-2);">
            <label for="register-phone" class="form-label">Phone Number</label>
            <input type="tel" id="register-phone" name="phone" class="form-input" required placeholder="+1 (555) 000-0000">
            <span class="form-error" style="display:none;color:var(--color-error);font-size:var(--small-size);margin-top:4px;">Please enter a valid phone number</span>
          </div>

          <div class="form-group" style="margin-top: var(--space-2);">
            <label for="register-password" class="form-label">Password</label>
            <input type="password" id="register-password" name="password" class="form-input" required placeholder="Min 8 characters">
            <div class="password-strength">
              <div class="password-strength__fill"></div>
              <span class="password-strength__label"></span>
            </div>
            <span class="form-error" style="display:none;color:var(--color-error);font-size:var(--small-size);margin-top:20px;">Password is required</span>
          </div>

          <div class="form-group" style="margin-top: var(--space-4);">
            <label for="register-confirm" class="form-label">Confirm Password</label>
            <input type="password" id="register-confirm" name="confirmPassword" class="form-input" required placeholder="Repeat password">
            <span class="form-error" style="display:none;color:var(--color-error);font-size:var(--small-size);margin-top:4px;">Passwords must match</span>
          </div>

          <div class="form-group" style="margin-top: var(--space-2);">
            <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: var(--small-size);">
              <input type="checkbox" name="terms" required style="accent-color: var(--color-accent); width: 16px; height: 16px; margin-top: 2px;">
              <span>I agree to the <a href="#" style="color:var(--color-accent); font-weight:var(--fw-medium);">Terms of Service</a> and <a href="#" style="color:var(--color-accent); font-weight:var(--fw-medium);">Privacy Policy</a>.</span>
            </label>
            <span class="form-error" style="display:none;color:var(--color-error);font-size:var(--small-size);margin-top:4px;">You must accept the terms</span>
          </div>

          <button type="submit" class="btn btn--primary btn--full" style="margin-top: var(--space-3);">Create Account</button>
          <p class="form-success" style="display:none;color:var(--color-success);font-size:var(--small-size);margin-top:10px;text-align:center;"></p>
        </form>

        <div style="margin: var(--space-3) 0; text-align: center; font-size: var(--xs-size); color: #9c9590;">OR</div>

        <!-- Social Logins -->
        <div class="social-logins">
          <button class="btn btn--outline btn--full" style="display:flex; justify-content:center; align-items:center; gap:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.22-.66-.35-1.36-.35-2.09z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign Up with Google
          </button>
          <button class="btn btn--outline btn--full" style="display:flex; justify-content:center; align-items:center; gap:8px; margin-top:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.22.67-2.94 1.51-.62.72-1.16 1.87-1.01 2.97 1.12.09 2.27-.61 2.96-1.42Z"/>
            </svg>
            Sign Up with Apple
          </button>
        </div>


        <div class="auth-form__footer">
          Already have an account? <a href="login.html">Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
