<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASH - 404 Page Not Found</title>
  <meta name="description" content="The page you are looking for does not exist. Return to the WASH homepage for premium laundry services.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="error-page-body">
  <main class="error-page">
    <!-- Error Page Background Overlay -->
    <div class="error-page__bg">
      <img src="https://images.unsplash.com/photo-1582735689369-4fe89db7114c?auto=format&fit=crop&w=1200&q=80" alt="Bubble texture in water drum" loading="eager">
    </div>

    <!-- Theme & RTL Toggles -->
    <div class="error-page__toggles">
      <button class="rtl-toggle toggle-btn" aria-label="Toggle text direction" title="Toggle RTL/LTR">RTL</button>
      <button class="theme-toggle toggle-btn" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
    </div>

    <!-- Floating Bubbles Layer -->
    <div class="bubbles">
      <div class="bubble" style="left: 10%; width: 40px; height: 40px; animation-duration: 8s; animation-delay: 0s;"></div>
      <div class="bubble" style="left: 22%; width: 24px; height: 24px; animation-duration: 6s; animation-delay: 1.5s;"></div>
      <div class="bubble" style="left: 35%; width: 55px; height: 55px; animation-duration: 11s; animation-delay: 0.5s;"></div>
      <div class="bubble" style="left: 48%; width: 30px; height: 30px; animation-duration: 7s; animation-delay: 2.5s;"></div>
      <div class="bubble" style="left: 63%; width: 38px; height: 38px; animation-duration: 9s; animation-delay: 1s;"></div>
      <div class="bubble" style="left: 77%; width: 48px; height: 48px; animation-duration: 10s; animation-delay: 3s;"></div>
      <div class="bubble" style="left: 90%; width: 20px; height: 20px; animation-duration: 5s; animation-delay: 2s;"></div>
    </div>

    <!-- Error Content -->
    <div class="error-page__content">
      <div class="error-page__code">404</div>
      <h1 class="error-page__title">Garments Misplaced</h1>
      <p class="error-page__text">
        Just like a single sock in the dryer, this page seems to have disappeared. Let's redirect you back to fresh territory.
      </p>
      <a href="index.html" class="btn btn--primary btn--lg">Return to Home</a>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
