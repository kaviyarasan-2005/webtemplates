<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INKA | Coming Soon - We're Upgrading</title>
  <meta name="description" content="INKA is upgrading its systems. Subscribe to be notified when we're back with an even better printing experience.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  <div class="coming-soon-page">
    <div class="page-toggles">
      <button class="toggle-btn rtl-toggle" aria-label="Toggle text direction">LTR</button>
      <button class="toggle-btn theme-toggle" aria-label="Toggle dark mode"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </div>
    <img src="https://images.unsplash.com/photo-1504639725590-34d0984388bd?auto=format&fit=crop&w=1920&q=60" alt="" class="error-bg" style="opacity:0.06;" aria-hidden="true" loading="eager">
    <div class="error-content" style="z-index:2;">
      <a href="index.html" aria-label="INKA Home" style="display: inline-block; margin: 0 auto var(--space-6);">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48" fill="none" style="margin: 0 auto;">
          <circle cx="24" cy="24" r="22" fill="#6C3483" opacity="0.15"/>
          <path d="M24 6C24 6 20 18 20 26C20 30.4183 21.7909 34 24 34C26.2091 34 28 30.4183 28 26C28 18 24 6 24 6Z" fill="#6C3483"/>
          <circle cx="24" cy="38" r="4" fill="#6C3483"/>
        </svg>
      </a>
      <h1 style="font-size:clamp(2rem,5vw,3rem);margin-bottom:var(--space-4);">We're Upgrading</h1>
      <p style="max-width:500px;margin:0 auto var(--space-6);">Our print shop is getting a fresh upgrade. We'll be back soon with an even better experience. Subscribe to get notified.</p>

      <div class="countdown" aria-label="Countdown timer">
        <div class="countdown-item">
          <div class="countdown-value" id="countdown-days">30</div>
          <div class="countdown-label">Days</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-value" id="countdown-hours">00</div>
          <div class="countdown-label">Hours</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-value" id="countdown-minutes">00</div>
          <div class="countdown-label">Minutes</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-value" id="countdown-seconds">00</div>
          <div class="countdown-label">Seconds</div>
        </div>
      </div>

      <form class="newsletter-form" aria-label="Get notified" style="margin-top:var(--space-8);">
        <input type="email" class="form-input" placeholder="Enter your email for updates" required aria-label="Email address">
        <button type="submit" class="btn btn-primary">Notify Me</button>
      </form>
    </div>
  </div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
