<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Coral / Pink Luxury Party Gradient -->
    <linearGradient id="festaLogoPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="50%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#DE3859" />
    </linearGradient>

    <!-- Modern Mint / Teal Gradient -->
    <linearGradient id="festaLogoSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4" />
      <stop offset="100%" stop-color="#1A938A" />
    </linearGradient>

    <!-- Premium Warm Gold Star Accent -->
    <linearGradient id="festaLogoGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#FFA900" />
    </linearGradient>

    <!-- Soft Glass Highlight -->
    <linearGradient id="festaHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Outer Decorative Ring / Celebration Arc -->
  <path d="M 28,78 A 38,38 0 1,1 88,48" fill="none" stroke="url(#festaLogoSecondary)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- Secondary Overlapping Elegant Arc Balloon (Teal) -->
  <path fill="url(#festaLogoSecondary)" opacity="0.88"
    d="M 62,30 C 74,30 84,40 84,52 C 84,62 76,70 66,74 L 64,77 C 63.5,78 61.5,78 61,77 L 59,74 C 55,72.5 52,69.5 50,65 C 57,63 62,56 62,48 C 62,41 58,35 52,32 C 55,30.7 58.4,30 62,30 Z" />

  <!-- Main Premium Balloon Emblem (Coral Gradient Teardrop Silhouette) -->
  <path fill="url(#festaLogoPrimary)"
    d="M 46,12 C 29.4,12 16,25.4 16,42 C 16,54.8 24,65.6 35.5,69.7 L 33,76 C 32.4,77.5 33.5,79 35,79 L 57,79 C 58.5,79 59.6,77.5 59,76 L 56.5,69.7 C 68,65.6 76,54.8 76,42 C 76,25.4 62.6,12 46,12 Z" />

  <!-- Inner Elegant Glass Gloss/Curved Reflection -->
  <path fill="url(#festaHighlight)"
    d="M 46,17 C 32.5,17 21.5,28 21.5,41.5 C 21.5,49.8 24.5,53.3 24.5,53.3 C 27,41 37.5,31.5 50.5,30 C 49.2,21.8 46,17 46,17 Z" />

  <!-- Deluxe Gold Celebration Sparkle Star (4-Point Diamond Sparkle) -->
  <path fill="url(#festaLogoGold)"
    d="M 78,14 Q 78,22 86,22 Q 78,22 78,30 Q 78,22 70,22 Q 78,22 78,14 Z" />
  <circle cx="20" cy="22" r="2.5" fill="url(#festaLogoGold)" />
  <circle cx="86" cy="62" r="2" fill="url(#festaLogoGold)" />

  <!-- Graceful Swirling Ribbon Tail -->
  <path fill="none" stroke="url(#festaLogoPrimary)" stroke-width="4" stroke-linecap="round"
    d="M 46,79 C 46,85 39,87 43,92 C 45,94.5 49,94 47,97" />
</svg>
