<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — FESTA Party Supplies</title>
  <meta name="description" content="Oops! The page you're looking for doesn't exist. Head back to FESTA's home page to explore our party decoration services." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/dark-mode.css" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-12) var(--space-6);
      background: var(--color-bg);
      position: relative;
      overflow: hidden;
    }
    .error-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,107,107,.08), transparent 70%);
      pointer-events: none;
    }
    .error-balloons {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .error-balloon {
      position: absolute;
      border-radius: 50%;
      opacity: .12;
      animation: floatUp 8s ease-in-out infinite alternate;
    }
    @keyframes floatUp {
      from { transform: translateY(0) rotate(-5deg); }
      to   { transform: translateY(-30px) rotate(5deg); }
    }
    .error-code {
      font-size: clamp(7rem, 20vw, 14rem);
      font-weight: 900;
      font-family: var(--font-display);
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-block-end: var(--space-4);
      position: relative;
    }
    .error-title {
      font-size: var(--text-3xl);
      font-weight: 700;
      color: var(--color-text-primary);
      margin-block-end: var(--space-4);
    }
    .error-desc {
      font-size: var(--text-lg);
      color: var(--color-text-secondary);
      max-width: 480px;
      margin-inline: auto;
      margin-block-end: var(--space-10);
      line-height: 1.7;
    }
    .error-actions {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
      justify-content: center;
      margin-block-end: var(--space-12);
    }
    .quick-links-bar {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
      justify-content: center;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .quick-links-bar span { font-weight: 500; }
    .quick-links-bar a {
      color: var(--color-primary);
      text-decoration: none;
      transition: opacity var(--transition-fast);
    }
    .quick-links-bar a:hover { opacity: .75; }
  </style>
  <script>
    (function () {
      const theme = localStorage.getItem('festa-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      const dir = localStorage.getItem('festa-dir') || 'ltr';
      document.documentElement.setAttribute('dir', dir);
    })();
  </script>
  <style>
    html { background-color: #FAF9F6; }
    html[data-theme="dark"] { background-color: #0A0A0A; }
  </style>
</head>
<body>
  <!-- Floating background balloons -->
  <div class="error-balloons" aria-hidden="true">
    <div class="error-balloon" style="width:200px;height:200px;background:var(--color-primary);top:5%;left:5%;animation-duration:7s;"></div>
    <div class="error-balloon" style="width:140px;height:140px;background:var(--color-secondary);top:15%;right:8%;animation-duration:9s;animation-delay:-3s;"></div>
    <div class="error-balloon" style="width:100px;height:100px;background:var(--color-accent);bottom:15%;left:10%;animation-duration:11s;animation-delay:-1s;"></div>
    <div class="error-balloon" style="width:180px;height:180px;background:var(--color-secondary);bottom:5%;right:5%;animation-duration:8s;animation-delay:-5s;"></div>
    <div class="error-balloon" style="width:80px;height:80px;background:var(--color-primary);top:50%;left:2%;animation-duration:6s;animation-delay:-2s;"></div>
    <div class="error-balloon" style="width:120px;height:120px;background:var(--color-accent);top:40%;right:2%;animation-duration:10s;animation-delay:-4s;"></div>
  </div>

  <main id="main-content" class="error-page" role="main">
    <!-- Brand -->
    <a href="index.html" class="navbar-brand" aria-label="FESTA Home" style="margin-block-end:var(--space-8);font-size:1.5rem">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:32px;height:32px" aria-hidden="true"><g fill="currentColor">
              <!-- Professional celebration balloon body -->
              <path d="M12 2a6.5 6.5 0 0 0-6.5 6.5c0 3.1 2 5.7 4.8 6.3L9 18.5a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1l-1.3-3.7c2.8-.6 4.8-3.2 4.8-6.3A6.5 6.5 0 0 0 12 2zm0 11c-2.5 0-4.5-2-4.5-4.5S9.5 4 12 4s4.5 2 4.5 4.5S14.5 13 12 13z"/>
              <!-- Balloon sparkles -->
              <path d="M19.5 2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1zM5.5 16.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1z"/>
              <!-- Inner celebration star -->
              <path d="M12 6.5l.8 1.7 1.9.3-1.4 1.3.3 1.9-1.6-1-1.6 1 .3-1.9-1.4-1.3 1.9-.3z"/>
            </g></svg>
      FESTA
    </a>

    <div class="error-code" aria-label="Error 404">404</div>

    <h1 class="error-title">This Party Moved!</h1>
    <p class="error-desc">The page you're looking for seems to have floated away like a balloon in the wind. Don't worry — there are plenty of celebrations to explore.</p>

    <div class="error-actions">
      <a href="index.html" class="btn btn-primary btn-lg">Go Back Home</a>
      <a href="contact.html" class="btn btn-outline btn-lg">Contact Us</a>
    </div>

    <div class="quick-links-bar">
      <span>Or explore:</span>
      <a href="services.html">Services</a>
      <a href="pricing.html">Pricing</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
