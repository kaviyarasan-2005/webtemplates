<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Folio Bookshop</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--primary-color); color: white; padding: 24px; text-align: center;">
        <div style="max-width: 600px;">
            <i class="ph ph-sparkle" style="font-size: 4rem; color: var(--secondary-color); margin-bottom: 24px;"></i>
            <h1 style="color: white; font-size: 3.5rem; margin-bottom: 16px;">Coming Soon</h1>
            <p style="color: rgba(255,255,255,0.8); font-size: 1.25rem; margin-bottom: 32px;">
                We are currently crafting a new chapter for our online store. Our digital shelves will be stocked with new arrivals shortly.
            </p>
            
            <form class="flex gap-2 justify-center" style="max-width: 400px; margin: 0 auto;">
                <input type="email" class="form-control" placeholder="Enter your email" required style="flex-grow: 1;">
                <button type="submit" class="btn btn-secondary">Notify Me</button>
            </form>
            
            <div class="social-links justify-center mt-4" style="margin-top: 48px;">
                <a href="#"><i class="ph ph-facebook-logo"></i></a>
                <a href="#"><i class="ph ph-instagram-logo"></i></a>
                <a href="#"><i class="ph ph-twitter-logo"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
