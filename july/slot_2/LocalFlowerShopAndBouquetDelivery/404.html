<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | BLOOM</title>
  <meta name="description" content="Oops! The page you're looking for doesn't exist. Head back to BLOOM's home page to find what you need.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='28' font-size='28'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .error-page {
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 10c-2 4-6 6-6 10 0 3 2.5 6 6 6s6-3 6-6c0-4-4-6-6-10z' fill='%23FAE5DD' fill-opacity='0.4'/%3E%3C/svg%3E");
    }
    .error-flower {
      position: relative;
      display: inline-block;
      margin-bottom: var(--space-3);
    }
    .wilt-petal-1 { top: 10px; right: -20px; animation-delay: 0s; }
    .wilt-petal-2 { top: 30px; left: -25px; animation-delay: 0.5s; }
    .wilt-petal-3 { top: 20px; right: -30px; animation-delay: 1s; }
    .wilt-petal-4 { top: 40px; left: -15px; animation-delay: 1.5s; }
    .wilt-petal-5 { top: 15px; right: -10px; animation-delay: 2s; }

    .wilt-petal svg {
      width: 16px;
      height: 16px;
      fill: var(--color-accent);
    }

    @keyframes wiltDrop {
      0% { opacity: 0.7; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(120px) rotate(90deg) translateX(30px); }
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-flower">
      <div class="error-code">404</div>
      <div class="wilt-petal wilt-petal-1" style="position:absolute"><svg viewBox="0 0 24 24"><path d="M12 2C9 7 4 9 4 14c0 4 3.5 8 8 8s8-4 8-8c0-5-5-7-8-12z"/></svg></div>
      <div class="wilt-petal wilt-petal-2" style="position:absolute"><svg viewBox="0 0 24 24"><path d="M12 2C9 7 4 9 4 14c0 4 3.5 8 8 8s8-4 8-8c0-5-5-7-8-12z"/></svg></div>
      <div class="wilt-petal wilt-petal-3" style="position:absolute"><svg viewBox="0 0 24 24"><path d="M12 2C9 7 4 9 4 14c0 4 3.5 8 8 8s8-4 8-8c0-5-5-7-8-12z"/></svg></div>
      <div class="wilt-petal wilt-petal-4" style="position:absolute"><svg viewBox="0 0 24 24"><path d="M12 2C9 7 4 9 4 14c0 4 3.5 8 8 8s8-4 8-8c0-5-5-7-8-12z"/></svg></div>
      <div class="wilt-petal wilt-petal-5" style="position:absolute"><svg viewBox="0 0 24 24"><path d="M12 2C9 7 4 9 4 14c0 4 3.5 8 8 8s8-4 8-8c0-5-5-7-8-12z"/></svg></div>
    </div>
    <p class="error-message">Oops! This bouquet got lost in transit.</p>
    <a href="index.html" class="btn btn-accent btn-lg">Back to Home <i class="ph ph-house"></i></a>
  </div>

  <script>
    // Check system theme
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    const saved = localStorage.getItem('bloom-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  </script>
</body>
</html>
