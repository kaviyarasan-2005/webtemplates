<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | LUXE Showroom</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    <header class="header">
        <div class="container header-container">
            <a href="../index.html" class="logo">
                <i class="fa-regular fa-gem"></i> LUXE
            </a>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark/Light Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <section class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: var(--space-16) 0;">
        <div style="max-width: 600px;">
            <i class="fa-regular fa-hourglass-half" style="font-size: 5rem; color: var(--accent); margin-bottom: var(--space-6);"></i>
            <h1 style="margin-bottom: var(--space-4);">Something Extraordinary is Coming</h1>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-8);">We are meticulously crafting a new experience. Enter your email below to be notified when we launch.</p>
            
            <form id="notify-form" novalidate style="display: flex; gap: var(--space-2); flex-wrap: wrap; justify-content: center;">
                <input type="email" class="form-control" placeholder="Enter your email address" required style="max-width: 300px;">
                <button type="submit" class="btn btn-primary">Notify Me</button>
            </form>
            <div style="margin-top: var(--space-4); display: flex; gap: var(--space-4); justify-content: center; font-size: 1.5rem; color: var(--text-secondary);">
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
            </div>
        </div>
    </section>

    <footer class="footer" style="padding: var(--space-6) 0;">
        <div class="container text-center" style="color: #A1A1AA; font-size: 0.875rem;">
            &copy; 2026 LUXE Showroom. All rights reserved.
        </div>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script>
        document.getElementById('notify-form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const input = e.target.querySelector('input');
            const btn = e.target.querySelector('button');
            if(input.value && input.validity.valid) {
                btn.textContent = 'Subscribed!';
                btn.style.backgroundColor = 'var(--success)';
                btn.style.color = '#fff';
                input.value = '';
                setTimeout(() => {
                    btn.textContent = 'Notify Me';
                    btn.style.backgroundColor = '';
                    btn.style.color = '';
                }, 3000);
            } else {
                input.style.borderColor = 'var(--error)';
            }
        });
    </script>
</body>
</html>
