<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Hydro</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
  <!-- Header -->
  <header class="header">
    <div class="container nav-container">
      <a href="../index.html" class="logo">
        <img src="../assets/logo-icon.svg" alt="Hydro Logo" style="height: 1.25em; width: auto; margin-right: 0.25rem; display: inline-block; vertical-align: text-bottom;">
        Hydro
      </a>
      
      <nav class="nav-menu">
        <div class="dropdown">
          <a href="#" class="nav-link">Home <i class="ri-arrow-down-s-line"></i></a>
          <div class="dropdown-menu">
            <a href="../index.html" class="dropdown-item">Home 1</a>
            <a href="home2.html" class="dropdown-item">Home 2</a>
          </div>
        </div>
        <a href="about.html" class="nav-link">About</a>
        <a href="service.html" class="nav-link">Batch</a>
        <a href="blog.html" class="nav-link">Blog</a>
        <a href="pricing.html" class="nav-link">Pricing</a>
        <a href="contact.html" class="nav-link">Contact</a>
        <a href="contact.html" class="btn btn-primary nav-enroll-mobile">Enroll Now</a>
      </nav>
      
      <div class="header-actions">
        <button id="dir-toggle" class="lang-btn" title="Toggle RTL/LTR">RTL</button>
        <button id="theme-toggle" class="icon-btn" title="Toggle Dark/Light Mode">
          <i id="theme-icon" class="ri-moon-line"></i>
        </button>
        <a href="contact.html" class="btn btn-primary nav-enroll-desktop" style="margin-left: 0.5rem;">Enroll Now</a>
        <button class="icon-btn mobile-toggle">
          <i class="ri-menu-3-line"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="hero-section hero-coming-soon" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-16) 0;">
    <div class="hero-overlay"></div>
    <div class="container hero-content text-center">
      <div style="font-size: 4rem; color: var(--color-secondary); margin-bottom: var(--space-4);">
        <i class="ri-timer-flash-line"></i>
      </div>
      <h1 style="margin-bottom: var(--space-4);">Something Amazing is Coming</h1>
      <p style="max-width: 500px; margin: 0 auto var(--space-6); font-size: 1.1rem;">We are working hard to bring you a new feature. Stay tuned, we will be launching very soon!</p>
      
      <form class="flex justify-center gap-2" style="max-width: 400px; margin: 0 auto;" onsubmit="event.preventDefault(); alert('Subscribed!');">
        <input type="email" class="form-control" placeholder="Enter your email" required style="flex-grow: 1; background-color: rgba(255,255,255,0.9); color: #0f172a;">
        <button type="submit" class="btn btn-secondary">Notify Me</button>
      </form>
    </div>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
