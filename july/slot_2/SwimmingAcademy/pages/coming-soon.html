<body style="display: flex; flex-direction: column; min-height: 100vh;">
  <!-- Header -->
  <header class="header">
    <div class="container nav-container">
      <a href="../index.html" class="logo">
        <i class="ri-water-flash-fill"></i>
        Hydro
      </a>
      
      <nav class="nav-menu">
        <div class="dropdown">
          <a href="#" class="nav-link">Home <i class="ri-arrow-down-s-line"></i></a>
          <div class="dropdown-menu">

          <i class="ri-text-direction-l"></i>

      <form class="flex justify-center gap-2" style="max-width: 400px; margin: 0 auto;" onsubmit="event.preventDefault(); alert('Subscribed!');">
