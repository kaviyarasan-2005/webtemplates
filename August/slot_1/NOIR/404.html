<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The page you're looking for doesn't exist. Return to NOIR.">
  <title>NOIR — Page Not Found</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-404 {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow: hidden;
    }
    .page-404__bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    .page-404__overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, rgba(10,10,10,0.4) 0%, var(--bg-primary) 100%);
      z-index: 1;
    }
    .page-404__logo {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.2em;
      color: var(--text-primary);
      text-decoration: none;
      z-index: 2;
    }
    .page-404__toggles {
      position: absolute;
      top: 40px;
      right: 40px;
      display: flex;
      gap: 16px;
      z-index: 2;
    }
    .page-404__num {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(80px, 15vw, 160px);
      font-weight: 300;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.2);
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    .page-404__title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 400;
      margin-bottom: 16px;
    }
    .page-404__text {
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto 40px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <!-- Ember animation container -->
  <div class="ember" aria-hidden="true"></div>
  
  <main class="page-404" id="main" role="main">
    <!-- Background -->
    <div class="page-404__bg" style="background-image:url('https://images.unsplash.com/photo-1575213823763-6e5f2e1b5d2b?w=1920&h=1080&fit=crop&q=85')" aria-hidden="true"></div>
    <div class="page-404__overlay" aria-hidden="true"></div>
    
    <!-- Logo (clickable, centered top) -->
    <a href="index.html" class="page-404__logo" aria-label="NOIR — Return home">NOIR</a>
    
    <!-- Toggles top right -->
    <div class="page-404__toggles">
      <button class="navbar__icon-btn" data-theme-toggle aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="navbar__rtl-btn" data-rtl-toggle>RTL</button>
    </div>
    
    <!-- Content -->
    <div style="position:relative;z-index:2;text-align:center">
      <div class="page-404__num" aria-hidden="true">404</div>
      <h1 class="page-404__title">Lost in the Smoke</h1>
      <p class="page-404__text">The page you're looking for seems to have drifted away. Perhaps a different path will lead you somewhere more distinguished.</p>
      <a href="index.html" class="btn btn--primary btn--lg">Return to NOIR</a>
    </div>
    
    <!-- Decorative footer text -->
    <p style="position:absolute;bottom:32px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-muted);z-index:2;">
      NOIR · Mayfair, London · Est. 2018
    </p>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
