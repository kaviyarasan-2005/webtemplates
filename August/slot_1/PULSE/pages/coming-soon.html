<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Upgrade in Progress | PULSE Arena</title>
  <meta name="description" content="The PULSE arena is undergoing tactical enhancements. Register to be notified the moment doors reopen.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='9' stroke='%2300f0ff' stroke-width='2.4' fill='none'/%3E%3Ccircle cx='17' cy='17' r='3.4' fill='%2300f0ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body data-nofooter="true" style="background:#050508;">

  <div class="auth-top-right">
    <button type="button" class="pill-toggle theme-toggle" id="coTheme" aria-label="Toggle color theme"><i class="ph-bold ph-moon-stars"></i><span></span></button>
    <button type="button" class="pill-toggle rtl-toggle" id="coRtl" aria-label="Toggle writing direction"><i class="ph-bold ph-swap"></i><span></span></button>
  </div>

  <main class="coming-page">
    <div class="coming-inner">
      <a href="index.html" class="brand-logo" aria-label="PULSE — back to home">
        <svg width="40" height="40" viewBox="0 0 34 34" fill="none" style="stroke:#00f0ff; filter:drop-shadow(0 0 10px rgba(0,240,255,0.8));" aria-hidden="true">
          <circle cx="17" cy="17" r="9" stroke="currentColor" stroke-width="2.4" fill="none"/>
          <circle cx="17" cy="17" r="3.4" fill="currentColor"/>
          <path d="M8.5 4.5 L4.5 2.5 L6.5 9 L3 8.5 L8 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M25.5 29.5 L29.5 31.5 L27.5 25 L31 25.5 L26 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-text">PULSE</span>
      </a>
      <i class="ph-bold ph-wrench co-icon" aria-hidden="true"></i>
      <h1>System Upgrade in Progress</h1>
      <p class="sub">The arena is undergoing tactical enhancements. We will be back online shortly.</p>

      <div class="countdown" id="countdown" data-target="2026-12-25T00:00:00" role="timer" aria-label="Countdown to reopening">
        <div class="cd-cell cd-days"><div class="cd-num">00</div><span class="cd-label">Days</span></div>
        <div class="cd-cell cd-hours"><div class="cd-num">00</div><span class="cd-label">Hours</span></div>
        <div class="cd-cell cd-mins"><div class="cd-num">00</div><span class="cd-label">Minutes</span></div>
        <div class="cd-cell cd-secs"><div class="cd-num">00</div><span class="cd-label">Seconds</span></div>
      </div>

      <form class="notify-form" data-validate novalidate>
        <div class="field">
          <label class="field-label sr-only" for="notify-email">Email Address</label>
          <input type="email" id="notify-email" name="email" placeholder="Get launch alerts" required data-error="Enter a valid email." autocomplete="email">
          <span class="field-error">Enter a valid email.</span>
        </div>
        <button type="submit" class="btn btn-fill"><span>Notify Me</span></button>
      </form>
    </div>
  </main>

  <script src="../assets/js/main.js" defer></script>
</body>
</html>
