<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE — Access Terminal</title>
  <meta name="description" content="Sign in to your PULSE player account to track stats, manage bookings, and enter league brackets.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='9' stroke='%2300f0ff' stroke-width='2.4' fill='none'/%3E%3Ccircle cx='17' cy='17' r='3.4' fill='%2300f0ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="auth-body" data-nofooter="true">

  <div class="auth-top-right">
    <button type="button" class="pill-toggle theme-toggle" id="authTheme" aria-label="Toggle color theme"><i class="ph-bold ph-moon-stars"></i><span></span></button>
    <button type="button" class="pill-toggle rtl-toggle" id="authRtl" aria-label="Toggle writing direction"><i class="ph-bold ph-swap"></i><span></span></button>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-brand" aria-label="PULSE — back to home">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" style="stroke:#00f0ff; filter:drop-shadow(0 0 6px rgba(0,240,255,0.7));" aria-hidden="true">
          <circle cx="17" cy="17" r="9" stroke="currentColor" stroke-width="2.4" fill="none"/>
          <circle cx="17" cy="17" r="3.4" fill="currentColor"/>
          <path d="M8.5 4.5 L4.5 2.5 L6.5 9 L3 8.5 L8 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M25.5 29.5 L29.5 31.5 L27.5 25 L31 25.5 L26 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-text">PULSE</span>
      </a>

      <h1 id="authTitle">Access Terminal</h1>

      <div data-auth-mode="login">
        <div class="auth-social">
          <button type="button" class="social-btn social-apple"><i class="ph-bold ph-apple-logo" aria-hidden="true"></i> Sign in with Apple</button>
          <button type="button" class="social-btn social-google"><i class="ph-bold ph-google-logo" aria-hidden="true"></i> Sign in with Google</button>
        </div>

        <div class="auth-divider">OR</div>

        <form class="auth-form" data-validate novalidate>
          <div class="field">
            <label class="field-label" for="lg-tag" >Gamer Tag / Email</label>
            <input type="text" id="lg-tag" name="tag" placeholder="VexOverdrive or gamer@pulsearena.example" required data-error="Enter your gamer tag or email." autocomplete="username">
            <span class="field-error">Enter your gamer tag or email.</span>
          </div>
          <div class="field">
            <label class="field-label" for="lg-pass" >Password</label>
            <div class="password-wrap">
              <input type="password" id="lg-pass" name="password" placeholder="••••••••" required minlength="8" data-error="Password must be at least 8 characters." autocomplete="current-password">
              <button type="button" class="password-toggle" aria-label="Show password"><i class="ph-bold ph-eye" aria-hidden="true"></i></button>
            </div>
            <span class="field-error">Password must be at least 8 characters.</span>
          </div>
          <div class="auth-row">
            <label class="checkbox"><input type="checkbox" name="remember"> <span>Remember me</span></label>
            <a href="#" style="color:var(--cyan);">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-fill btn-block"><span>Access Terminal</span></button>
        </form>

        <div class="auth-switch">New Player? <a href="#" data-auth-switch="register" style="color:var(--cyan); font-weight:700;">Register</a></div>
      </div>

      <div data-auth-mode="register" class="hidden">
        <form class="auth-form" data-validate novalidate>
          <div class="field">
            <label class="field-label" for="rg-tag" >Gamer Tag</label>
            <input type="text" id="rg-tag" name="tag" placeholder="Pick a gamer tag" required data-error="Choose a gamer tag." autocomplete="username">
            <span class="field-error">Choose a gamer tag.</span>
          </div>
          <div class="field">
            <label class="field-label" for="rg-email" >Email</label>
            <input type="email" id="rg-email" name="email" placeholder="you@pulsearena.example" required data-error="Enter a valid email." autocomplete="email">
            <span class="field-error">Enter a valid email.</span>
          </div>
          <div class="field">
            <label class="field-label" for="rg-phone" >Phone</label>
            <input type="tel" id="rg-phone" name="phone" placeholder="+1 555 000 0000" autocomplete="tel">
          </div>
          <div class="field">
            <label class="field-label" for="rg-pass" >Password</label>
            <div class="password-wrap">
              <input type="password" id="rg-pass" name="password" placeholder="Min 8 characters" required minlength="8" data-error="Password must be at least 8 characters." autocomplete="new-password">
              <button type="button" class="password-toggle" aria-label="Show password"><i class="ph-bold ph-eye" aria-hidden="true"></i></button>
            </div>
            <span class="field-error">Password must be at least 8 characters.</span>
          </div>
          <div class="field">
            <label class="field-label" for="rg-pass2" >Confirm Password</label>
            <div class="password-wrap">
              <input type="password" id="rg-pass2" name="password2" placeholder="Repeat password" required data-rule="match" data-match="rg-pass" data-error="Passwords do not match." autocomplete="new-password">
              <button type="button" class="password-toggle" aria-label="Show password"><i class="ph-bold ph-eye" aria-hidden="true"></i></button>
            </div>
            <span class="field-error">Passwords do not match.</span>
          </div>
          <label class="checkbox" style="margin:2px 0 18px;"><input type="checkbox" name="age"> <span>I confirm I am at least 7 years old.</span></label>
          <button type="submit" class="btn btn-fill btn-block"><span>Create Account</span></button>
        </form>

        <div class="auth-switch">Already registered? <a href="#" data-auth-switch="login" style="color:var(--cyan); font-weight:700;">Login</a></div>
      </div>
    </div>
  </div>

  <script src="../assets/js/main.js" defer></script>
</body>
</html>
