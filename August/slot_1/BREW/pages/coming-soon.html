<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | BREW</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <meta name="description" content="We're upgrading our equipment. The BREW Home Brewing Supply shop will be back online shortly.">
  <meta property="og:title" content="Coming Soon | BREW">
  <meta property="og:description" content="BREW Home Brewing Supply is upgrading. Stay tuned for our relaunch.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/fill/style.css">
  <script src="../assets/js/main.js" defer></script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;position:relative;padding:24px;">
  <div class="page-toggles" style="position:fixed;top:24px;right:24px;z-index:200;">
    <button class="navbar__toggle" data-theme-toggle aria-label="Toggle theme">
      <i class="ph-fill ph-moon"></i>
    </button>
    <button class="navbar__toggle" data-rtl-toggle aria-label="Toggle RTL">
      LTR
    </button>
  </div>

  <div class="blob blob--amber" style="width:400px;height:400px;top:-100px;right:-100px;position:absolute;border-radius:50%;background:var(--color-primary);filter:blur(80px);opacity:0.06;pointer-events:none;"></div>
  <div class="blob blob--green" style="width:300px;height:300px;bottom:-50px;left:-50px;position:absolute;border-radius:50%;background:var(--color-secondary);filter:blur(80px);opacity:0.06;pointer-events:none;"></div>

  <div style="position:relative;z-index:1;max-width:600px;width:100%;">
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px;">
      <div style="width:40px;height:40px;background:var(--color-primary);border-radius:12px;display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C10.9 2 10 2.9 10 4V8.26C8.81 9.15 8 10.5 8 12V17L6 19V20H18V19L16 17V12C16 10.5 15.19 9.15 14 8.26V4C14 2.9 13.1 2 12 2ZM12 4C12.55 4 13 4.45 13 5V8C13 8.55 12.55 9 12 9C11.45 9 11 8.55 11 8V5C11 4.45 11.45 4 12 4Z" fill="white"/>
        </svg>
      </div>
      <span style="font-family:'Nunito',sans-serif;font-weight:800;font-size:22px;color:var(--color-text-primary);">BREW</span>
    </div>

    <h1 style="font-size:clamp(28px,5vw,44px);margin-bottom:16px;line-height:1.2;">Something New is Brewing</h1>
    <p style="color:var(--color-text-secondary);max-width:500px;margin:0 auto 40px;">We're upgrading our equipment. The shop will be back online shortly.</p>

    <div class="clay-card" style="padding:32px 24px;margin-bottom:32px;">
      <div class="countdown" style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;">
        <div class="countdown__item" style="display:flex;flex-direction:column;align-items:center;">
          <span class="countdown__number">05</span>
          <span class="countdown__label">Days</span>
        </div>
        <div class="countdown__item" style="display:flex;flex-direction:column;align-items:center;">
          <span class="countdown__number">12</span>
          <span class="countdown__label">Hours</span>
        </div>
        <div class="countdown__item" style="display:flex;flex-direction:column;align-items:center;">
          <span class="countdown__number">34</span>
          <span class="countdown__label">Minutes</span>
        </div>
        <div class="countdown__item" style="display:flex;flex-direction:column;align-items:center;">
          <span class="countdown__number">56</span>
          <span class="countdown__label">Seconds</span>
        </div>
      </div>
    </div>

    <form style="max-width:500px;margin:0 auto;display:flex;gap:8px;">
      <input type="email" placeholder="Enter your email" style="flex:1;padding:14px 20px;border-radius:999px;border:2px solid var(--color-surface);background:var(--color-background);color:var(--color-text);font-size:16px;font-family:inherit;outline:none;transition:border-color 0.2s;">
      <button type="submit" class="btn btn--primary">Notify Me</button>
    </form>

    <div style="margin-top:32px;">
      <i class="ph-fill ph-hourglass" style="font-size:32px;color:var(--color-primary);opacity:0.5;"></i>
    </div>
  </div>
</body>
</html>
