<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a free BREW account to join our craft brewing community, receive fresh ingredient discounts, and save custom recipes.">
  <title>Sign Up | BREW — Home Brewing Supply Store</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">

  <!-- Open Graph -->
  <meta property="og:title" content="Sign Up | BREW">
  <meta property="og:description" content="Create a free BREW account to join our craft brewing community.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://brewstore.com/pages/signup.html">

  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/fill/style.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 24px; background-color: var(--color-background);">

  <!-- Top Controls: Logo Link + Dark Mode & RTL Toggles -->
  <div style="position: absolute; top: 24px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; width: calc(100% - 48px); z-index: 10;">
    <a href="index.html" class="navbar__logo" aria-label="BREW Home" style="text-decoration: none;">
      <div class="navbar__logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="brewSignupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f59e0b" />
              <stop offset="100%" stop-color="#d97706" />
            </linearGradient>
          </defs>
          <path d="M22 13H24.5C26.433 13 28 14.567 28 16.5V19.5C28 21.433 26.433 23 24.5 23H22V20H24.5C24.7761 20 25 19.7761 25 19.5V16.5C25 16.2239 24.7761 16 24.5 16H22V13Z" fill="url(#brewSignupGrad)" />
          <path d="M6 11C6 9.89543 6.89543 9 8 9H22C23.1046 9 24 9.89543 24 11V23C24 25.7614 21.7614 28 19 28H11C8.23858 28 6 25.7614 6 23V11Z" fill="url(#brewSignupGrad)" />
          <path d="M5 10C5 8.34315 6.34315 7 8 7C8.35064 7 8.68722 7.06015 9 7.17071C9.6385 5.89069 10.9613 5 12.5 5C14.0934 5 15.4563 5.9479 16.0673 7.30752C16.6186 7.11029 17.212 7 17.8333 7C20.1345 7 22 8.86548 22 11.1667C22 11.2789 21.9956 11.3901 21.9868 11.5H5.01317C5.00442 11.3901 5 11.2789 5 11.1667C5 10.7618 5.05775 10.37 5.16482 10.0003C5.05792 10.0001 5 10 5 10Z" fill="#FFFFFF" />
          <circle cx="10" cy="16" r="1.2" fill="#FFFFFF" opacity="0.75"/>
          <circle cx="14" cy="20" r="1.1" fill="#FFFFFF" opacity="0.75"/>
          <circle cx="18" cy="15" r="1.4" fill="#FFFFFF" opacity="0.75"/>
        </svg>
      </div>
      <span class="navbar__logo-text">BREW</span>
    </a>

    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="navbar__toggle" data-theme-toggle aria-label="Toggle dark mode">
        <i class="ph-fill ph-moon" aria-hidden="true"></i>
      </button>
      <button class="navbar__toggle navbar__toggle-label" data-rtl-toggle aria-label="Toggle text direction">
        LTR
      </button>
    </div>
  </div>

  <!-- ============================================
       MAIN SIGNUP CARD CONTAINER
       ============================================ -->
  <main style="width: 100%; display: flex; justify-content: center; align-items: center; margin-top: 60px; margin-bottom: 40px;">
    <div class="auth-card reveal" style="max-width: 480px;">

      <h1>Join the Community</h1>
      <p style="color: var(--color-text-secondary); margin-bottom: 24px; font-size: 14px;">Create a free account to order fresh ingredients and save brewing recipes</p>

      <!-- Social Logins -->
      <div class="auth-social">
        <button class="auth-social-btn auth-social-btn--google" type="button">
          <i class="ph-bold ph-google-logo" style="font-size: 18px; color: #ea4335;"></i>
          Sign up with Google
        </button>
        <button class="auth-social-btn auth-social-btn--apple" type="button">
          <i class="ph-fill ph-apple-logo" style="font-size: 18px;"></i>
          Sign up with Apple
        </button>
      </div>

      <div class="auth-divider">or register with email</div>

      <!-- Signup Form -->
      <form class="auth-form" data-validate action="#" method="POST">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" name="name" required placeholder="Alex Morgan">
          <span class="error-message">Please enter your full name</span>
        </div>

        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" name="email" required placeholder="you@example.com">
          <span class="error-message">Please enter a valid email</span>
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" required placeholder="At least 8 characters">
          <i class="ph-fill ph-eye password-toggle" aria-label="Toggle password visibility"></i>
          <span class="error-message">Password must be at least 8 characters</span>
        </div>

        <div class="form-group">
          <label for="signup-confirm">Confirm Password</label>
          <input type="password" id="signup-confirm" name="confirm_password" required placeholder="Re-enter password">
          <i class="ph-fill ph-eye password-toggle" aria-label="Toggle password visibility"></i>
          <span class="error-message">Passwords do not match</span>
        </div>

        <div class="form-row" style="margin-bottom: 20px;">
          <label class="checkbox-label">
            <input type="checkbox" name="terms" required>
            I agree to the <a href="#" style="color: var(--color-primary); text-decoration: none;">Terms of Service</a> & <a href="#" style="color: var(--color-primary); text-decoration: none;">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn btn--primary" style="width: 100%; padding: 14px; font-size: 16px;">
          Create My Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" style="color: var(--color-primary); text-decoration: none;">Log in here</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../assets/js/main.js"></script>
</body>
</html>
