<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Route Not Found | CRAG Climbing Gym</title>
  <meta name="description" content="The page you are looking for does not exist. Return to the CRAG climbing gym homepage.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <style>
    .error-page {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(113,113,122,.06) 59px, rgba(113,113,122,.06) 60px),
        repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(113,113,122,.06) 59px, rgba(113,113,122,.06) 60px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      text-align: center;
      position: relative;
    }
    .auth-page__toggles {
      position: fixed;
      top: 20px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 200;
    }
    .error-page__content {
      max-width: 600px;
    }
    .error-page__number {
      display: block;
      font-family: var(--font-heading);
      font-size: clamp(120px, 20vw, 220px);
      font-weight: 700;
      line-height: 1;
      color: var(--orange);
      letter-spacing: -4px;
      /* Brutalist offset shadow on the number */
      text-shadow: 8px 8px 0 var(--pitch-black);
      margin-bottom: 8px;
    }
    [data-theme="dark"] .error-page__number {
      text-shadow: 8px 8px 0 var(--chalk-white);
    }
    .error-page__icon {
      font-size: 80px;
      color: var(--orange);
      margin-bottom: 16px;
      display: block;
      animation: wobble 2.4s ease-in-out infinite;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-8deg); }
      50%       { transform: rotate(8deg); }
    }
    .error-page__heading {
      font-family: var(--font-heading);
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 16px;
      color: var(--text);
    }
    .error-page__desc {
      font-size: 1rem;
      color: var(--text-sub);
      max-width: 480px;
      margin: 0 auto 32px;
      line-height: 1.7;
    }
    .error-page__actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-page__brand {
      margin-top: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      text-decoration: none;
      color: var(--text-sub);
      font-family: var(--font-heading);
      font-size: 18px;
      letter-spacing: 3px;
      opacity: .6;
      transition: opacity .15s;
    }
    .error-page__brand:hover { opacity: 1; }
    .error-page__divider {
      width: 80px;
      height: 3px;
      background: var(--orange);
      margin: 0 auto 28px;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <!-- Toggles -->
    <div class="auth-page__toggles" role="toolbar" aria-label="Display settings">
      <button class="btn-toggle btn-theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <i class="ph-bold ph-moon" aria-hidden="true"></i>
      </button>
      <button class="btn-toggle btn-rtl-toggle" data-rtl-toggle aria-label="Toggle direction">LTR</button>
    </div>

    <div class="error-page__content">
      <span class="error-page__number" aria-label="Error 404">404</span>
      <div class="error-page__divider" aria-hidden="true"></div>

      <i class="ph-bold ph-warning-octagon error-page__icon" aria-hidden="true"></i>

      <h1 class="error-page__heading">Route Not Found</h1>
      <p class="error-page__desc">
        The page you are looking for has been decommissioned, moved, or never existed on our wall.
        Double-check the URL or head back to base.
      </p>

      <div class="error-page__actions">
        <a href="../index.html" class="btn btn-primary">
          <i class="ph-bold ph-house" aria-hidden="true"></i> Back to Base
        </a>
        <a href="contact.html" class="btn btn-outline">
          <i class="ph-bold ph-lifebuoy" aria-hidden="true"></i> Get Help
        </a>
      </div>

      <!-- Quick links -->
      <div style="margin-top:48px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <a href="services.html" style="font-size:.85rem;font-weight:600;color:var(--text-sub);text-decoration:none;padding:6px 12px;border:1px solid rgba(113,113,122,.3)">Services</a>
        <a href="pricing.html"  style="font-size:.85rem;font-weight:600;color:var(--text-sub);text-decoration:none;padding:6px 12px;border:1px solid rgba(113,113,122,.3)">Pricing</a>
        <a href="blog.html"     style="font-size:.85rem;font-weight:600;color:var(--text-sub);text-decoration:none;padding:6px 12px;border:1px solid rgba(113,113,122,.3)">Blog</a>
        <a href="about.html"    style="font-size:.85rem;font-weight:600;color:var(--text-sub);text-decoration:none;padding:6px 12px;border:1px solid rgba(113,113,122,.3)">About</a>
      </div>

      <a href="../index.html" class="error-page__brand" aria-label="CRAG homepage">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <rect width="40" height="40" fill="#ea580c"/>
          <path d="M5 32L20 8L35 32H5Z" fill="#0a0a0a"/>
          <circle cx="20" cy="18" r="4" fill="#ea580c"/>
          <path d="M14 26L20 20L26 26" stroke="#fafafa" stroke-width="2.5" fill="none"/>
        </svg>
        CRAG
      </a>
    </div>
  </div>

  <script src="../assets/js/main.js" defer></script>
</body>
</html>
