<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Access | CRAG Climbing Gym</title>
  <meta name="description" content="Sign in to your CRAG member account or create a new account to access the member portal, track progress, and manage bookings.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <style>
    .auth-page {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(113,113,122,.08) 59px, rgba(113,113,122,.08) 60px),
        repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(113,113,122,.08) 59px, rgba(113,113,122,.08) 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      position: relative;
    }
    .auth-page__toggles {
      position: fixed;
      top: 20px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 200;
    }
    .auth-card {
      background: var(--surface);
      border: var(--border);
      box-shadow: 6px 6px 0px 0px var(--shadow-color);
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
    .auth-card__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 4px;
    }
    .auth-card__brand-name {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: 3px;
    }
    .auth-card__subtitle {
      text-align: center;
      font-size: .85rem;
      color: var(--text-sub);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .auth-card__title {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 16px;
      border: var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: .9rem;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 10px;
      transition: box-shadow .15s, transform .15s;
      box-shadow: 3px 3px 0 var(--shadow-color);
    }
    .social-btn:hover {
      box-shadow: 5px 5px 0 var(--shadow-color);
      transform: translate(-2px, -2px);
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-sub);
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }
    .form-group--inline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .875rem;
      color: var(--text-sub);
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--orange);
      cursor: pointer;
    }
    .auth-footer-text {
      text-align: center;
      font-size: .875rem;
      color: var(--text-sub);
      margin-top: 20px;
    }
    .auth-footer-text a {
      color: var(--orange);
      font-weight: 700;
      text-decoration: none;
    }
    .auth-footer-text a:hover { text-decoration: underline; }
    .forgot-link {
      color: var(--orange);
      font-size: .875rem;
      font-weight: 600;
      text-decoration: none;
    }
    .forgot-link:hover { text-decoration: underline; }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper .form-control { padding-right: 48px; }
    .input-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-sub);
      padding: 4px;
      font-size: 18px;
      line-height: 1;
    }
    .required { color: var(--orange); }
    @media (max-height: 700px) {
      .auth-page { align-items: flex-start; padding: 20px 16px; }
      .auth-card { padding: 28px; }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <!-- Theme/RTL toggles -->
    <div class="auth-page__toggles" role="toolbar" aria-label="Display settings">
      <button class="btn-toggle btn-theme-toggle" data-theme-toggle aria-label="Toggle dark mode" id="theme-toggle-auth">
        <i class="ph-bold ph-moon" aria-hidden="true"></i>
      </button>
      <button class="btn-toggle btn-rtl-toggle" data-rtl-toggle aria-label="Toggle direction" id="rtl-toggle-auth">LTR</button>
    </div>

    <!-- LOGIN PANEL -->
    <div id="panel-login">
      <div class="auth-card">
        <div class="auth-card__brand">
          <svg width="36" height="36" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <rect width="40" height="40" fill="#ea580c"/>
            <path d="M5 32L20 8L35 32H5Z" fill="#0a0a0a"/>
            <circle cx="20" cy="18" r="4" fill="#ea580c"/>
            <path d="M14 26L20 20L26 26" stroke="#fafafa" stroke-width="2.5" fill="none"/>
          </svg>
          <span class="auth-card__brand-name">CRAG</span>
        </div>
        <p class="auth-card__subtitle">Member Access</p>
        <h1 class="auth-card__title">SIGN IN</h1>

        <!-- Social Login -->
        <a href="#" class="social-btn" aria-label="Sign in with Apple">
          <svg width="18" height="18" viewBox="0 0 814 1000" fill="currentColor" aria-hidden="true"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-34.4-148.9-89.9C140.5 774 80 682 80 552.8 80 382.6 200.5 278 318.7 278c68.7 0 125.8 42.4 170.1 42.4 42.4 0 108.7-44.5 185.8-44.5zM616.4 118.7c30.7-36.5 52.4-86.8 52.4-137.1 0-8.4-.6-16.8-2-24.5-49.8 1.9-110 33.1-146.1 75.5-28 31.6-54.6 82.3-54.6 133.3 0 9 1.9 18.1 2.6 21.1 3.2.6 8.4 1.3 13.6 1.3 44.5 0 100.3-29.4 134.1-69.6z"/></svg>
          Sign in with Apple
        </a>
        <a href="#" class="social-btn" aria-label="Sign in with Google">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Sign in with Google
        </a>

        <div class="auth-divider">OR</div>

        <form data-validate id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="l-email">Email <span class="required" aria-hidden="true">*</span></label>
            <input class="form-control" type="email" id="l-email" name="email" required placeholder="your@email.com" autocomplete="email">
            <span class="form-error" role="alert" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="l-password">Password <span class="required" aria-hidden="true">*</span></label>
            <div class="input-wrapper">
              <input class="form-control" type="password" id="l-password" name="password" required placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="input-toggle" aria-label="Toggle password visibility">
                <i class="ph-bold ph-eye-slash" aria-hidden="true"></i>
              </button>
            </div>
            <span class="form-error" role="alert" aria-live="polite"></span>
          </div>
          <div class="form-group--inline">
            <label class="checkbox-group">
              <input type="checkbox" name="remember" id="l-remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%" data-original="Sign In">Sign In</button>
        </form>

        <p class="auth-footer-text">New climber? <a href="#" data-show="register" id="to-register">Join the community</a></p>
      </div>
    </div>

    <!-- REGISTER PANEL -->
    <div id="panel-register" hidden>
      <div class="auth-card">
        <div class="auth-card__brand">
          <svg width="36" height="36" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <rect width="40" height="40" fill="#ea580c"/>
            <path d="M5 32L20 8L35 32H5Z" fill="#0a0a0a"/>
            <circle cx="20" cy="18" r="4" fill="#ea580c"/>
            <path d="M14 26L20 20L26 26" stroke="#fafafa" stroke-width="2.5" fill="none"/>
          </svg>
          <span class="auth-card__brand-name">CRAG</span>
        </div>
        <p class="auth-card__subtitle">Member Access</p>
        <h1 class="auth-card__title">CREATE ACCOUNT</h1>

        <form data-validate id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="r-name">Full Name <span class="required" aria-hidden="true">*</span></label>
            <input class="form-control" type="text" id="r-name" name="name" required placeholder="Jane Climber" autocomplete="name">
            <span class="form-error" role="alert" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="r-email">Email <span class="required" aria-hidden="true">*</span></label>
            <input class="form-control" type="email" id="r-email" name="email" required placeholder="your@email.com" autocomplete="email">
            <span class="form-error" role="alert" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="r-phone">Phone</label>
            <input class="form-control" type="tel" id="r-phone" name="phone" placeholder="(303) 555-0000" autocomplete="tel">
          </div>
          <div class="form-group">
            <label class="form-label" for="r-password">Password <span class="required" aria-hidden="true">*</span></label>
            <div class="input-wrapper">
              <input class="form-control" type="password" id="r-password" name="password" required placeholder="••••••••" autocomplete="new-password">
              <button type="button" class="input-toggle" aria-label="Toggle password visibility">
                <i class="ph-bold ph-eye-slash" aria-hidden="true"></i>
              </button>
            </div>
            <span class="form-error" role="alert" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="r-confirm">Confirm Password <span class="required" aria-hidden="true">*</span></label>
            <div class="input-wrapper">
              <input class="form-control" type="password" id="r-confirm" name="confirm" required placeholder="••••••••" autocomplete="new-password">
              <button type="button" class="input-toggle" aria-label="Toggle confirm password visibility">
                <i class="ph-bold ph-eye-slash" aria-hidden="true"></i>
              </button>
            </div>
            <span class="form-error" role="alert" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label class="checkbox-group">
              <input type="checkbox" id="r-terms" name="terms" required>
              <span>I agree to the gym rules and <a href="#" style="color:var(--orange)">Terms of Service</a></span>
            </label>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%" data-original="Create Account">Create Account</button>
        </form>

        <p class="auth-footer-text">Already a member? <a href="#" data-show="login" id="to-login">Sign In</a></p>
      </div>
    </div>

  </div>

  <script src="../assets/js/main.js" defer></script>
</body>
</html>
