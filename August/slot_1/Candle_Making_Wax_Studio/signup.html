<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUME — Create an Account</title>
  <meta name="description" content="Sign up for a LUME account to track orders and save your favorite scents.">
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page">
  <div class="auth-layout">
    <!-- Image Side -->
    <div class="auth-image" style="order:2;">
      <img src="assets/images/heroes/hero-shop.png" alt="Candle workshop interior" loading="eager">
      <div class="auth-image__overlay"></div>
      <a href="index.html" class="auth-logo">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="24" cy="13" r="11" fill="#E8A84C" opacity="0.18"/><path d="M24 2.5C24 2.5 18.6 8.6 18.6 12.8C18.6 15.9 21 18.3 24 18.3C27 18.3 29.4 15.9 29.4 12.8C29.4 8.6 24 2.5 24 2.5Z" fill="#E8A84C"/><path d="M24 8.6C24 8.6 21.7 11.3 21.7 13.2C21.7 14.6 22.7 15.7 24 15.7C25.3 15.7 26.3 14.6 26.3 13.2C26.3 11.3 24 8.6 24 8.6Z" fill="#FAF4EB"/><rect x="23.2" y="17.6" width="1.6" height="4.6" rx="0.8" fill="#6B5848"/><path d="M10.5 24.5H37.5V38.5C37.5 41.5 35 44 32 44H16C13 44 10.5 41.5 10.5 38.5V24.5Z" fill="#C97B3D"/><ellipse cx="24" cy="24.5" rx="13.5" ry="2.6" fill="#E9C48E"/><ellipse cx="24" cy="24.5" rx="10.5" ry="1.7" fill="#F6E2BC"/><rect x="15.5" y="30" width="17" height="9" rx="2.2" fill="#FAF4EB" opacity="0.94"/><path d="M19.2 33.6H28.8M21.2 36.1H26.8" stroke="#C97B3D" stroke-width="1.3" stroke-linecap="round"/></svg>
      </a>
      <div class="auth-quote">
        "Bring the light in."
      </div>
    </div>
    
    <!-- Form Side -->
    <div class="auth-panel-wrap" style="order:1;">
      <div class="auth-panel">
        <h1 class="auth-panel__title">Create Account</h1>
        <p class="auth-panel__subtitle">Join LUME to track orders and save your favorite scents.</p>
        
        <form data-validate class="auth-form" action="user-dashboard.html" method="GET">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);">
            <div class="form-group">
              <label class="form-label">First Name</label>
              <input type="text" class="form-input" required>
              <span class="form-error">Required.</span>
            </div>
            <div class="form-group">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-input" required>
              <span class="form-error">Required.</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" placeholder="hello@example.com" required>
            <span class="form-error">Please enter a valid email.</span>
          </div>
          
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="password-input-wrap">
              <input type="password" class="form-input password-input" id="signup-password" placeholder="••••••••" required>
              <button type="button" class="password-toggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="password-strength">
              <div class="password-strength__bar"></div>
            </div>
            <span class="form-error">Password must be at least 8 characters.</span>
          </div>
          
          <div class="form-group">
            <label style="display:flex;align-items:flex-start;gap:8px;font-size:var(--caption-size);color:var(--color-text-secondary);cursor:pointer;line-height:1.4;">
              <input type="checkbox" required style="margin-top:2px;"> 
              <span>I agree to the <a href="#" style="color:var(--color-primary);">Terms of Service</a> and <a href="#" style="color:var(--color-primary);">Privacy Policy</a>.</span>
            </label>
          </div>
          
          <button type="submit" class="btn btn--primary btn--full">Sign Up</button>
        </form>
        
        <div class="auth-divider"><span>or sign up with</span></div>
        
        <div class="auth-social">
          <button class="btn btn--outline auth-social-btn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Google
          </button>
        </div>
        
        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>

  <script src="assets/js/forms.js"></script>
</body>
</html>
