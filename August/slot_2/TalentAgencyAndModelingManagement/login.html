<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 42'><rect width='42' height='42' rx='6' fill='%230D0D0D'/><polyline points='8,31 8,13 15,22 21,11 27,22 34,13 34,31' stroke='%23FFFFFF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/><line x1='12' y1='35' x2='30' y2='35' stroke='%23E8253A' stroke-width='2.5' stroke-linecap='round'/></svg>"/>
  <title>MUSE — Talent &amp; Admin Sign In</title>
  <meta name="description" content="Sign in to your MUSE agency portal. Access verified casting calls, legal contracts, global payment histories, and talent management tools with your account.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <script>(function(){const t=localStorage.getItem('muse-theme')||'light';if(t==='dark')document.documentElement.classList.add('dark');const d=localStorage.getItem('muse-dir')||'ltr';document.documentElement.setAttribute('dir',d);})();</script>
</head>
<body class="auth-page">

  <!-- Compact Top Corner Toggles -->
  <div class="auth-toggles">
    <button class="toggle-theme-btn btn-sm btn-outline" style="padding:6px 12px;font-size:0.75rem;" aria-label="Toggle dark mode">Mode</button>
    <button class="toggle-rtl-btn btn-sm btn-outline" style="padding:6px 12px;font-size:0.75rem;" aria-label="Toggle text direction">RTL</button>
  </div>

  <!-- Background with noir overlay -->
  <div class="auth-bg" style="background-image: url('https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=1600&q=80'); filter: blur(3px);"></div>
  <div class="auth-overlay"></div>

  <!-- Auth Card -->
  <div class="auth-card">
    <a href="index.html" class="auth-logo" aria-label="MUSE Home">
      <div class="auth-logo-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" fill="none"><rect class="logo-mark-bg" width="42" height="42" rx="6" fill="#0D0D0D"/><polyline class="logo-mark-m" points="8,31 8,13 15,22 21,11 27,22 34,13 34,31" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line class="logo-mark-runway" x1="12" y1="35" x2="30" y2="35" stroke="#E8253A" stroke-width="2.5" stroke-linecap="round"/></svg></div><span class="auth-logo-word">MUSE</span>
    </a>

    <h1 class="auth-heading">Welcome Back</h1>

    <!-- Demo Role Selector -->
    <div class="auth-segmented" role="tablist" aria-label="Sign-in role selector">
      <button type="button" class="auth-seg-btn active" id="role-talent-btn" role="tab" aria-selected="true">Talent</button>
      <button type="button" class="auth-seg-btn" id="role-admin-btn" role="tab" aria-selected="false">Admin</button>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" for="login-email">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required value="marchetti@muse.agency">
        <span class="form-hint" id="email-error" style="color:var(--clr-accent);display:none;font-size:0.75rem;margin-top:4px;">Please enter a valid email address.</span>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="••••••••">
        <span class="form-hint" id="password-error" style="color:var(--clr-accent);display:none;font-size:0.75rem;margin-top:4px;">Password must be at least 6 characters.</span>
      </div>

      <a href="#" class="auth-forgot" id="forgot-link">Forgot password?</a>

      <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width: 100%; justify-content: center; padding: 12px 20px;">
        Sign In as Talent
      </button>
    </form>

    <div class="auth-divider">or continue with</div>

    <div class="auth-social-row">
      <!-- Google -->
      <button type="button" class="auth-social-btn google" id="btn-google">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Apple -->
      <button type="button" class="auth-social-btn apple" id="btn-apple">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.93-2.85-.9.04-2 0.6-2.65 1.35-.58.67-1.09 1.74-.96 2.77 1.01.08 2.05-.52 2.68-1.27z"/>
        </svg>
        Continue with Apple
      </button>

      <!-- Facebook -->
      <button type="button" class="auth-social-btn facebook" id="btn-facebook">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        Continue with Facebook
      </button>
    </div>

    <div class="auth-foot">
      New here? <a href="signup.html">Create an account</a>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    (function() {
      let activeRole = 'Talent';
      const talentBtn = document.getElementById('role-talent-btn');
      const adminBtn = document.getElementById('role-admin-btn');
      const submitBtn = document.getElementById('login-submit-btn');
      const emailInput = document.getElementById('login-email');
      const loginForm = document.getElementById('login-form');

      if (talentBtn && adminBtn) {
        talentBtn.addEventListener('click', () => {
          activeRole = 'Talent';
          talentBtn.classList.add('active');
          talentBtn.setAttribute('aria-selected', 'true');
          adminBtn.classList.remove('active');
          adminBtn.setAttribute('aria-selected', 'false');
          submitBtn.textContent = 'Sign In as Talent';
          emailInput.value = 'marchetti@muse.agency';
        });

        adminBtn.addEventListener('click', () => {
          activeRole = 'Admin';
          adminBtn.classList.add('active');
          adminBtn.setAttribute('aria-selected', 'true');
          talentBtn.classList.remove('active');
          talentBtn.setAttribute('aria-selected', 'false');
          submitBtn.textContent = 'Sign In as Admin';
          emailInput.value = 'director@muse.agency';
        });
      }

      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = emailInput.value.trim();
          const pass = document.getElementById('login-password').value.trim();
          let valid = true;

          const emailErr = document.getElementById('email-error');
          const passErr = document.getElementById('password-error');

          if (!email || !email.includes('@')) {
            if (emailErr) emailErr.style.display = 'block';
            valid = false;
          } else {
            if (emailErr) emailErr.style.display = 'none';
          }

          if (pass.length < 4) {
            if (passErr) passErr.style.display = 'block';
            valid = false;
          } else {
            if (passErr) passErr.style.display = 'none';
          }

          if (valid) {
            submitBtn.textContent = 'Authenticating...';
            submitBtn.style.opacity = '0.7';
            setTimeout(() => {
              if (activeRole === 'Admin') {
                window.location.href = 'admin-dashboard.html';
              } else {
                window.location.href = 'user-dashboard.html';
              }
            }, 500);
          }
        });
      }
    })();
  </script>
</body>
</html>
