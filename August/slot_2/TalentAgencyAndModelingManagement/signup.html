<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 42'><rect width='42' height='42' rx='6' fill='%230D0D0D'/><polyline points='8,31 8,13 15,22 21,11 27,22 34,13 34,31' stroke='%23FFFFFF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/><line x1='12' y1='35' x2='30' y2='35' stroke='%23E8253A' stroke-width='2.5' stroke-linecap='round'/></svg>"/>
  <title>MUSE — Talent Application &amp; Registration</title>
  <meta name="description" content="Apply to join the prestigious MUSE talent roster. Create your professional account to submit comp cards, receive casting invites, and get booked worldwide.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <script>(function(){const t=localStorage.getItem('muse-theme')||'light';if(t==='dark')document.documentElement.classList.add('dark');const d=localStorage.getItem('muse-dir')||'ltr';document.documentElement.setAttribute('dir',d);})();</script>
</head>
<body class="auth-page">

  <!-- Compact Top Corner Toggles -->
  <div class="auth-toggles">
    <button class="toggle-theme-btn btn-sm btn-outline" style="padding:6px 12px;font-size:0.75rem;" aria-label="Toggle dark mode">Mode</button>
    <button class="toggle-rtl-btn btn-sm btn-outline" style="padding:6px 12px;font-size:0.75rem;" aria-label="Toggle text direction">RTL</button>
  </div>

  <!-- Background with noir overlay (Different backstage photo) -->
  <div class="auth-bg" style="background-image: url('https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1600&q=80'); filter: blur(3px);"></div>
  <div class="auth-overlay"></div>

  <!-- Auth Card -->
  <div class="auth-card" style="padding: 28px 32px;">
    <a href="index.html" class="auth-logo" style="margin-bottom: 16px;" aria-label="MUSE Home">
      <div class="auth-logo-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" fill="none"><rect class="logo-mark-bg" width="42" height="42" rx="6" fill="#0D0D0D"/><polyline class="logo-mark-m" points="8,31 8,13 15,22 21,11 27,22 34,13 34,31" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line class="logo-mark-runway" x1="12" y1="35" x2="30" y2="35" stroke="#E8253A" stroke-width="2.5" stroke-linecap="round"/></svg></div><span class="auth-logo-word">MUSE</span>
    </a>

    <h1 class="auth-heading" style="font-size: 1.35rem; margin-bottom: 16px;">Start Your Application</h1>

    <!-- Talent Category Segmented Buttons -->
    <div class="auth-segmented" role="tablist" aria-label="Talent category" style="margin-bottom: 14px;">
      <button type="button" class="auth-seg-btn active cat-btn" role="tab" data-cat="Model" aria-selected="true" style="padding:6px 8px;font-size:0.75rem;">Model</button>
      <button type="button" class="auth-seg-btn cat-btn" role="tab" data-cat="Actor" aria-selected="false" style="padding:6px 8px;font-size:0.75rem;">Actor</button>
      <button type="button" class="auth-seg-btn cat-btn" role="tab" data-cat="Influencer" aria-selected="false" style="padding:6px 8px;font-size:0.75rem;">Influencer</button>
      <button type="button" class="auth-seg-btn cat-btn" role="tab" data-cat="Creator" aria-selected="false" style="padding:6px 8px;font-size:0.75rem;">Creator</button>
    </div>

    <form id="signup-form" novalidate>
      <div class="form-group" style="margin-bottom: 10px;">
        <label class="form-label" for="signup-name" style="font-size:0.78rem;margin-bottom:4px;">Full Name</label>
        <input type="text" id="signup-name" class="form-control" placeholder="e.g. Elena Rostova" required style="padding:8px 12px;font-size:0.82rem;">
        <span class="form-hint" id="name-error" style="color:var(--clr-accent);display:none;font-size:0.72rem;margin-top:2px;">Please enter your full legal name.</span>
      </div>

      <div class="form-group" style="margin-bottom: 10px;">
        <label class="form-label" for="signup-email" style="font-size:0.78rem;margin-bottom:4px;">Email Address</label>
        <input type="email" id="signup-email" class="form-control" placeholder="name@domain.com" required style="padding:8px 12px;font-size:0.82rem;">
        <span class="form-hint" id="email-error" style="color:var(--clr-accent);display:none;font-size:0.72rem;margin-top:2px;">Please enter a valid email.</span>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" for="signup-password" style="font-size:0.78rem;margin-bottom:4px;">Password</label>
          <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required style="padding:8px 12px;font-size:0.82rem;">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" for="signup-confirm" style="font-size:0.78rem;margin-bottom:4px;">Confirm</label>
          <input type="password" id="signup-confirm" class="form-control" placeholder="••••••••" required style="padding:8px 12px;font-size:0.82rem;">
        </div>
      </div>
      <span class="form-hint" id="pass-error" style="color:var(--clr-accent);display:none;font-size:0.72rem;margin-top:-6px;margin-bottom:8px;">Passwords must match and be ≥ 6 chars.</span>

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        <input type="checkbox" id="terms-check" required style="accent-color:var(--clr-accent);cursor:pointer;">
        <label for="terms-check" style="font-size:0.74rem;color:var(--clr-text-muted);cursor:pointer;">
          I agree to the <a href="#" style="color:var(--clr-accent);">Representation Terms</a> &amp; Privacy Policy
        </label>
      </div>

      <button type="submit" class="btn btn-primary" id="signup-submit-btn" style="width: 100%; justify-content: center; padding: 10px 16px; font-size:0.88rem;">
        Create Account
      </button>
    </form>

    <div class="auth-divider" style="margin: 12px 0;">or sign up with</div>

    <div class="auth-social-row" style="gap: 8px; margin-bottom: 14px;">
      <button type="button" class="auth-social-btn google" style="padding:8px 12px;font-size:0.8rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Google
      </button>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <button type="button" class="auth-social-btn apple" style="padding:8px 12px;font-size:0.8rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.93-2.85-.9.04-2 0.6-2.65 1.35-.58.67-1.09 1.74-.96 2.77 1.01.08 2.05-.52 2.68-1.27z"/>
          </svg>
          Apple
        </button>
        <button type="button" class="auth-social-btn facebook" style="padding:8px 12px;font-size:0.8rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Facebook
        </button>
      </div>
    </div>

    <div class="auth-foot" style="margin-top: 10px;">
      Already represented? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    (function() {
      let selectedCat = 'Model';
      const catBtns = document.querySelectorAll('.cat-btn');
      catBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          catBtns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          selectedCat = btn.dataset.cat;
        });
      });

      const form = document.getElementById('signup-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('signup-name').value.trim();
          const email = document.getElementById('signup-email').value.trim();
          const pass = document.getElementById('signup-password').value;
          const confirm = document.getElementById('signup-confirm').value;
          const terms = document.getElementById('terms-check').checked;

          let valid = true;
          const nameErr = document.getElementById('name-error');
          const emailErr = document.getElementById('email-error');
          const passErr = document.getElementById('pass-error');

          if (!name) { if (nameErr) nameErr.style.display = 'block'; valid = false; } else { if (nameErr) nameErr.style.display = 'none'; }
          if (!email || !email.includes('@')) { if (emailErr) emailErr.style.display = 'block'; valid = false; } else { if (emailErr) emailErr.style.display = 'none'; }
          if (pass.length < 6 || pass !== confirm) { if (passErr) passErr.style.display = 'block'; valid = false; } else { if (passErr) passErr.style.display = 'none'; }
          if (!terms) { valid = false; alert('Please accept the Representation Terms.'); return; }

          if (valid) {
            const btn = document.getElementById('signup-submit-btn');
            btn.textContent = 'Creating Account...';
            btn.style.opacity = '0.7';
            setTimeout(() => {
              window.location.href = 'user-dashboard.html';
            }, 600);
          }
        });
      }
    })();
  </script>
</body>
</html>
