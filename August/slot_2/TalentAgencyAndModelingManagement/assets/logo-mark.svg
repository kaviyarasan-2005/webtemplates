<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" fill="none">
  <!-- Background rounded square -->
  <rect class="logo-mark-bg" width="42" height="42" rx="6" fill="#0D0D0D"/>
  <!-- Geometric M mark: two mirrored angular strokes meeting at the centre peak -->
  <!-- Left stroke: bottom-left → top-centre -->
  <polyline class="logo-mark-m"
    points="8,31 8,13 15,22 21,11 27,22 34,13 34,31"
    stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Runway accent line: crimson underline -->
  <line class="logo-mark-runway"
    x1="12" y1="35" x2="30" y2="35"
    stroke="#E8253A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
