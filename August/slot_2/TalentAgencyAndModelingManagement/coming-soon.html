<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSE — Places, Please | We're Almost On</title>
  <meta name="description" content="MUSE is preparing the next major release of our global talent agency platform. Enter your email to be notified the moment the curtains rise on our new features.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <script>(function(){const t=localStorage.getItem('muse-theme')||'light';if(t==='dark')document.documentElement.classList.add('dark');const d=localStorage.getItem('muse-dir')||'ltr';document.documentElement.setAttribute('dir',d);})();</script>
</head>
<body class="coming-soon-page">

  <!-- Clickable MUSE Logo top-left -->
  <a href="index.html" class="page-404-logo navbar-logo" style="text-decoration:none;">
    <div class="navbar-logo-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" fill="none"><rect class="logo-mark-bg" width="42" height="42" rx="6" fill="#E8253A"/><polyline class="logo-mark-m" points="8,31 8,13 15,22 21,11 27,22 34,13 34,31" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line class="logo-mark-runway" x1="12" y1="35" x2="30" y2="35" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/></svg></div>
    <div class="navbar-logo-text"><span class="navbar-logo-word" style="color:#fff;">MUSE</span></div>
  </a>

  <!-- Compact Top Right Toggles -->
  <div class="auth-toggles">
    <button class="toggle-theme-btn btn-sm btn-outline" style="padding:6px 12px;font-size:0.75rem;border-color:rgba(255,255,255,0.3);color:#fff;" aria-label="Toggle dark mode">Mode</button>
    <button class="toggle-rtl-btn btn-sm btn-outline" style="padding:6px 12px;font-size:0.75rem;border-color:rgba(255,255,255,0.3);color:#fff;" aria-label="Toggle text direction">RTL</button>
  </div>

  <!-- Backstage mirror background photo + noir overlay -->
  <div class="coming-soon-bg" style="background-image: url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=1600&q=80');"></div>
  <div class="coming-soon-overlay"></div>

  <!-- Content -->
  <div class="coming-soon-content container" style="max-width: 640px;">
    <!-- Dressing Room Mirror Ringed with Bulbs (Half Lit via main.js) -->
    <div class="coming-mirror">
      <div class="mirror-frame">
        <div style="font-family:var(--font-display);font-size:2.2rem;font-weight:700;color:rgba(255,255,255,0.85);letter-spacing:0.1em;">
          MUSE
        </div>
      </div>
      <!-- 12 bulbs around mirror -->
      <div style="position:absolute;inset:-16px;pointer-events:none;">
        <span class="mirror-bulb" style="top:0;left:50%;transform:translateX(-50%);"></span>
        <span class="mirror-bulb" style="top:7%;right:25%;"></span>
        <span class="mirror-bulb" style="top:25%;right:7%;"></span>
        <span class="mirror-bulb" style="top:50%;right:0;transform:translateY(-50%);"></span>
        <span class="mirror-bulb" style="bottom:25%;right:7%;"></span>
        <span class="mirror-bulb" style="bottom:7%;right:25%;"></span>
        <span class="mirror-bulb" style="bottom:0;left:50%;transform:translateX(-50%);"></span>
        <span class="mirror-bulb" style="bottom:7%;left:25%;"></span>
        <span class="mirror-bulb" style="bottom:25%;left:7%;"></span>
        <span class="mirror-bulb" style="top:50%;left:0;transform:translateY(-50%);"></span>
        <span class="mirror-bulb" style="top:25%;left:7%;"></span>
        <span class="mirror-bulb" style="top:7%;left:25%;"></span>
      </div>
    </div>

    <!-- Headline -->
    <h1 class="coming-h1">Places, Please — We're Almost On</h1>
    <p style="color:rgba(255,255,255,0.7);font-size:1.05rem;margin-bottom:32px;line-height:1.6;">
      Final lighting checks are underway. Subscribe below to be notified the second the curtain rises.
    </p>

    <!-- Email Notify Form + Rose Button -->
    <form class="coming-soon-form" id="coming-form" onsubmit="event.preventDefault(); document.getElementById('coming-btn').textContent='Added to Guestlist!'; document.getElementById('coming-btn').disabled=true;">
      <input type="email" class="form-control" placeholder="Enter your email" required style="background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.25);">
      <button type="submit" class="btn btn-primary" id="coming-btn" style="white-space:nowrap;padding:12px 24px;">
        Notify Me
      </button>
    </form>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
