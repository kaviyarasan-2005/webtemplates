<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EXIM - New features launching soon.">
  <title>Coming Soon | EXIM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,15 85,35 50,55 15,35' fill='%23C96F2E'/><polygon points='15,35 50,55 50,95 15,75' fill='%23123332'/><polygon points='50,55 85,35 85,75 50,95' fill='%232A5A58'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

  <!-- SINGLE FULLSCREEN COMING SOON SECTION -->
  <section class="hero construction-hero single-construction-section">
    <!-- TOP-CENTER LOGO FOR HOME NAVIGATION -->
    <header class="standalone-header">
      <a href="index.html" class="nav-brand standalone-brand" aria-label="EXIM Home">
        <svg class="brand-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
          <polygon points="50,15 85,35 50,55 15,35" fill="var(--exim-copper)"/>
          <polygon points="15,35 50,55 50,95 15,75" fill="currentColor"/>
          <polygon points="50,55 85,35 85,75 50,95" fill="currentColor" opacity="0.8"/>
        </svg>
        EXIM
      </a>
    </header>

    <div class="hero-bg" style="background-image: url('images/hero-digital-portal.png'); filter: grayscale(100%) brightness(0.35); z-index: 0; pointer-events: none;"></div>

    <div class="container text-center relative z-10" style="position: relative; z-index: 10;">
      <h1 class="construction-title">Digital Freight Portal<br>Launching Soon</h1>
      <p class="construction-desc">We are building the next generation of supply chain visibility. Live GPS tracking, instant quoting, and automated customs filing.</p>
      
      <!-- REAL-TIME RUNNING COUNTDOWN TIMER -->
      <div class="countdown-timer mt-4" aria-label="Countdown to Launch">
        <div class="time-box">
          <span id="cd-days">00</span>
          <label>Days</label>
        </div>
        <div class="timer-colon" aria-hidden="true">:</div>
        <div class="time-box">
          <span id="cd-hours">00</span>
          <label>Hours</label>
        </div>
        <div class="timer-colon" aria-hidden="true">:</div>
        <div class="time-box">
          <span id="cd-minutes">00</span>
          <label>Minutes</label>
        </div>
        <div class="timer-colon" aria-hidden="true">:</div>
        <div class="time-box">
          <span id="cd-seconds">00</span>
          <label>Seconds</label>
        </div>
      </div>
      
      <!-- PROGRESS BAR -->
      <div class="progress-bar-wrap mt-4" style="max-width: 500px; margin: 2rem auto 0;">
        <div class="progress-labels" style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: #fff; font-family: monospace;">
          <span>System Assembly</span>
          <span>85%</span>
        </div>
        <div class="progress-track" style="position: relative; width: 100%; height: 8px; background-color: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden;">
          <div class="cs-progress-fill" style="width: 85%; height: 100%; background-color: var(--exim-copper); border-radius: 4px;"></div>
        </div>
      </div>

      <!-- NOTIFY ME FORM -->
      <div class="notify-box mt-4" style="max-width: 500px; margin: 2rem auto 0;">
        <form class="exim-form" onsubmit="event.preventDefault(); alert('Thank you! You have been added to the early access list.');">
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center;">
            <input type="email" placeholder="Enter corporate email for early access..." required style="flex: 1; min-width: 250px; padding: 0.85rem 1rem; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; background: rgba(0,0,0,0.4); color: #fff; outline: none;">
            <button type="submit" class="btn btn-primary">Notify Me</button>
          </div>
        </form>
      </div>

      <!-- SOCIAL FOLLOW & RETURN HOME -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1.25rem; margin-top: 2rem;">
        <div class="social-icons" style="justify-content: center;">
          <a href="#" aria-label="LinkedIn"><svg class="icon" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2;"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg></a>
          <a href="#" aria-label="X"><svg class="icon" viewBox="0 0 24 24" style="fill:#fff;stroke:none;"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
          <a href="#" aria-label="Facebook"><svg class="icon" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2;"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
          <a href="#" aria-label="Instagram"><svg class="icon" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2;"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
        </div>
        <a href="index.html" class="btn btn-outline" style="border-color: rgba(255,255,255,0.4); color: #fff;">Return to Homepage</a>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
  <script>
    // Real-time live countdown timer (standard website running timer implementation)
    (function() {
      const STORAGE_KEY = 'exim_portal_launch_date';
      let targetTimestamp;

      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored && !isNaN(stored) && Number(stored) > Date.now()) {
          targetTimestamp = Number(stored);
        }
      } catch (e) {}

      if (!targetTimestamp) {
        // Set target 42 days, 14 hours, 32 minutes, 18 seconds from now
        targetTimestamp = Date.now() + (42 * 24 * 60 * 60 + 14 * 60 * 60 + 32 * 60 + 18) * 1000;
        try {
          localStorage.setItem(STORAGE_KEY, targetTimestamp);
        } catch (e) {}
      }

      const dEl = document.getElementById('cd-days');
      const hEl = document.getElementById('cd-hours');
      const mEl = document.getElementById('cd-minutes');
      const sEl = document.getElementById('cd-seconds');

      function pad(val) {
        return String(val).padStart(2, '0');
      }

      function updateCountdown() {
        const now = Date.now();
        let remaining = Math.max(0, targetTimestamp - now);

        const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
        remaining %= (1000 * 60 * 60 * 24);

        const hours = Math.floor(remaining / (1000 * 60 * 60));
        remaining %= (1000 * 60 * 60);

        const minutes = Math.floor(remaining / (1000 * 60));
        remaining %= (1000 * 60);

        const seconds = Math.floor(remaining / 1000);

        if (dEl) dEl.textContent = pad(days);
        if (hEl) hEl.textContent = pad(hours);
        if (mEl) mEl.textContent = pad(minutes);
        if (sEl) sEl.textContent = pad(seconds);

        if (days === 0 && hours === 0 && minutes === 0 && seconds === 0) {
          clearInterval(timerInterval);
        }
      }

      updateCountdown();
      const timerInterval = setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
