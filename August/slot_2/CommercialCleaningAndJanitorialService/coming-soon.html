<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Polishing Things Up — SPOT</title>
  <meta name="description" content="We are currently polishing things up! Subscribe to get notified as soon as this feature launches."/>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/dark-mode.css"/>
</head>
<body style="background:#080010;margin:0;overflow:hidden;">

  <main class="coming-soon-page" role="main">
    <!-- Blurred office corridor background image -->
    <div class="cs-bg" style="background-image:url('images/pristine-modern-corporate-facility.png');" role="img" aria-label="Blurred pristine commercial office hallway"></div>
    <div class="cs-overlay" aria-hidden="true"></div>

    <!-- Top right quick controls -->
    <div style="position:absolute;top:2rem;right:2rem;display:flex;gap:.75rem;z-index:10;">
      <button class="nav-icon-btn theme-toggle-btn" aria-label="Switch theme" style="background:rgba(255,255,255,.1);color:#fff;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="rtl-toggle-btn" aria-label="Switch to RTL direction" style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.9);">RTL</button>
    </div>

    <!-- Main Content -->
    <div class="cs-content fade-up">
      <!-- Clickable Logo Header -->
      <a href="index.html" class="cs-logo-wrap" aria-label="SPOT — Home">
        <svg class="nav-logo-mark" viewBox="0 0 36 36" fill="none" aria-hidden="true" style="width:36px;height:36px;">
          <path d="M18 2L19.4 13L18 14.5L16.6 13L18 2Z" fill="#C8FF00"/>
          <path d="M18 21.5L19.4 32.5L18 34L16.6 32.5L18 21.5Z" fill="#C8FF00"/>
          <path d="M2 18L13 16.6L14.5 18L13 19.4L2 18Z" fill="#C8FF00"/>
          <path d="M21.5 18L32.5 16.6L34 18L32.5 19.4L21.5 18Z" fill="#C8FF00"/>
          <circle cx="18" cy="18" r="4" fill="#C8FF00"/>
          <circle cx="7" cy="7" r="1.5" fill="#C8FF00" opacity="0.5"/>
          <circle cx="29" cy="7" r="1.5" fill="#C8FF00" opacity="0.5"/>
          <circle cx="7" cy="29" r="1.5" fill="#C8FF00" opacity="0.5"/>
          <circle cx="29" cy="29" r="1.5" fill="#C8FF00" opacity="0.5"/>
        </svg>
        <span class="cs-brand">SPOT</span>
      </a>

      <!-- Rotating Floor Buffer polishing the SPOT Logo into a gleam -->
      <div class="cs-buffer" aria-hidden="true">
        <div class="cs-buffer-disc">
          <div class="cs-buffer-shine"></div>
        </div>
        <div class="cs-logo-on-disc">SPOT</div>
      </div>

      <!-- Headline & Subtitle -->
      <h1>Polishing Things Up</h1>
      <p>We're putting the finishing touches on this new service portal. Drop your email to get early access the moment we launch.</p>

      <!-- Email notify input + Lime CTA button -->
      <form class="cs-notify-form" novalidate aria-label="Notify me when launched">
        <input type="email" placeholder="Enter your business email" required aria-label="Business email address" id="cs-email"/>
        <button type="submit" class="btn btn-primary" style="white-space:nowrap;">Notify Me</button>
      </form>
      <div class="spray-success" id="cs-success-msg" role="status" aria-live="polite" style="display:none;margin-top:1.5rem;color:var(--clr-accent);font-weight:700;">
        ✨ You're on the VIP list! We'll notify you when it's gleaming.
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    const csForm = document.querySelector('.cs-notify-form');
    const csSuccess = document.getElementById('cs-success-msg');
    if (csForm && csSuccess) {
      csForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = csForm.querySelector('input');
        if (input && input.value.trim() && input.checkValidity()) {
          csForm.style.display = 'none';
          csSuccess.style.display = 'block';
        }
      });
    }
  </script>
</body>
</html>
