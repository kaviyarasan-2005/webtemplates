<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — We Missed a Spot | SPOT</title>
  <meta name="description" content="We missed a spot! The page you are looking for has been swept away or does not exist."/>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/dark-mode.css"/>
</head>
<body>

  <main class="page-404" role="main">
    <!-- Clickable SPOT logo top-left -->
    <a href="index.html" class="standalone-logo" aria-label="SPOT — Home">
      <svg class="nav-logo-mark" viewBox="0 0 36 36" fill="none" aria-hidden="true" style="width:34px;height:34px;">
        <path d="M18 2L19.4 13L18 14.5L16.6 13L18 2Z" fill="#C8FF00"/>
        <path d="M18 21.5L19.4 32.5L18 34L16.6 32.5L18 21.5Z" fill="#C8FF00"/>
        <path d="M2 18L13 16.6L14.5 18L13 19.4L2 18Z" fill="#C8FF00"/>
        <path d="M21.5 18L32.5 16.6L34 18L32.5 19.4L21.5 18Z" fill="#C8FF00"/>
        <circle cx="18" cy="18" r="4" fill="#C8FF00"/>
        <circle cx="7" cy="7" r="1.5" fill="#C8FF00" opacity="0.5"/>
        <circle cx="29" cy="7" r="1.5" fill="#C8FF00" opacity="0.5"/>
        <circle cx="7" cy="29" r="1.5" fill="#C8FF00" opacity="0.5"/>
        <circle cx="29" cy="29" r="1.5" fill="#C8FF00" opacity="0.5"/>
      </svg>
      <span>SPOT</span>
    </a>

    <!-- Top right quick controls (Theme & Direction) -->
    <div style="position:absolute;top:2rem;right:2rem;display:flex;gap:.75rem;z-index:10;">
      <button class="nav-icon-btn theme-toggle-btn" aria-label="Switch theme" style="background:rgba(255,255,255,.1);color:#fff;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="rtl-toggle-btn" aria-label="Switch to RTL direction" style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.9);">RTL</button>
    </div>

    <!-- Stain Splotch Graphic with 404 inside -->
    <div class="stain-graphic" id="stain-graphic" title="Stain to wipe clean">
      <div class="stain-blob" id="stain-blob">
        <span class="stain-number" aria-hidden="true">404</span>
      </div>
    </div>

    <!-- Error Messaging -->
    <h1>We Missed a Spot</h1>
    <p>This page got away from us. Even our expert crews can't find whatever was here.</p>

    <!-- Sponge Graphic CTA Button -->
    <div class="sponge-btn">
      <a href="index.html" class="sponge-shape" id="sponge-wipe-btn" aria-label="Wipe back to Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="width:22px;height:22px;">
          <rect x="2" y="6" width="20" height="12" rx="4"/>
          <circle cx="7" cy="12" r="1" fill="currentColor"/>
          <circle cx="12" cy="10" r="1" fill="currentColor"/>
          <circle cx="12" cy="14" r="1" fill="currentColor"/>
          <circle cx="17" cy="12" r="1" fill="currentColor"/>
        </svg>
        <span>Wipe Back to Home</span>
      </a>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
