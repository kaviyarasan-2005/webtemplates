<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Beautiful — Coming Soon | VOWS</title>
  <meta name="description" content="A new collection of luxury wedding planning destinations and bespoke styling services is currently being curated by VOWS.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='7' fill='none' stroke='%23C9A8E0' stroke-width='2.5'/%3E%3Ccircle cx='21' cy='16' r='7' fill='none' stroke='%23C9A8E0' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>
<div class="coming-soon-page">
  <div class="coming-soon-bg" aria-hidden="true"></div>
  <div class="coming-soon-overlay" aria-hidden="true"></div>

  <!-- Top Logo & Controls -->
  <a href="index.html" class="coming-soon-logo" aria-label="Back to VOWS Home">
    <svg class="nav-logo-mark" viewBox="0 0 36 36" fill="none" style="width:36px;height:36px">
      <circle cx="13" cy="18" r="8.5" stroke="#C9A8E0" stroke-width="2.5"/>
      <circle cx="23" cy="18" r="8.5" stroke="#FAF5F7" stroke-width="2.5"/>
    </svg>
    <span class="nav-logo-text" style="color:var(--color-accent);font-family:var(--font-display);font-size:1.5rem;font-weight:700">VOWS</span>
  </a>

  <div class="coming-soon-controls">
    <button class="nav-toggle-btn" data-theme-toggle aria-label="Toggle dark mode">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="nav-toggle-btn nav-rtl-btn" data-rtl-toggle aria-label="Switch to RTL">RTL</button>
  </div>

  <div class="coming-soon-content">
    <span class="section-eyebrow" style="color:var(--color-accent)">A New Chapter</span>
    <h1 class="quill-headline">
      <span id="quill-text">Something Beautiful Is Being Planned</span>
      <span class="quill-cursor" aria-hidden="true"></span>
    </h1>
    <p class="coming-soon-sub">
      We are curating an extraordinary new collection of bespoke destination venues and private villa collections for the 2026/2027 season.
    </p>

    <form class="coming-soon-form" id="notify-form" novalidate>
      <input type="email" placeholder="Your email for preview invitation" required aria-label="Your email">
      <button type="submit" class="btn btn-primary">Notify Me</button>
    </form>

    <div style="margin-top:2.5rem">
      <a href="index.html" class="btn btn-ghost" style="color:white;border-color:rgba(255,255,255,.3)">&larr; Return to VOWS Main Site</a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
