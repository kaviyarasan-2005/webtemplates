<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VOWS</title>
  <meta name="description" content="Sign in to your VOWS wedding planning or administrator dashboard.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='7' fill='none' stroke='%23C9A8E0' stroke-width='2.5'/%3E%3Ccircle cx='21' cy='16' r='7' fill='none' stroke='%23C9A8E0' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-bg" style="background-image:url('images/login-auth-bg.png')" aria-hidden="true"></div>
  <div class="auth-overlay" aria-hidden="true"></div>

  <!-- Top Controls -->
  <div class="auth-compact-controls">
    <button class="nav-toggle-btn" data-theme-toggle aria-label="Toggle dark mode">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="nav-toggle-btn nav-rtl-btn" data-rtl-toggle aria-label="Switch to RTL">RTL</button>
  </div>

  <!-- Auth Card -->
  <div class="auth-card">
    <div class="auth-brand">
      <a href="index.html" class="auth-brand-logo" aria-label="Back to VOWS Home">
        <svg class="nav-logo-mark" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <circle cx="13" cy="18" r="8.5" stroke="#C9A8E0" stroke-width="2.5"/>
          <circle cx="23" cy="18" r="8.5" stroke="currentColor" stroke-width="2.5"/>
        </svg>
        <span class="nav-logo-text">VOWS</span>
      </a>
      <div class="auth-heading">Sign In to VOWS</div>
      <p style="font-size:.82rem;color:var(--color-text-secondary);margin:0">Access your ceremony portal &amp; timelines</p>
    </div>

    <!-- Role Switcher (Demo switcher: Couple -> user-dashboard, Admin -> admin-dashboard) -->
    <div class="role-selector" role="tablist" aria-label="Select portal type">
      <button type="button" class="role-btn active" data-role="couple" role="tab" aria-selected="true">Couple Portal</button>
      <button type="button" class="role-btn" data-role="admin" role="tab" aria-selected="false">Planner Admin</button>
    </div>

    <form class="invite-form" id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email" class="form-label">Email Address</label>
        <input type="email" id="login-email" class="form-input" value="elena@vowsweddings.com" required>
      </div>

      <div class="form-group">
        <label for="login-pass" class="form-label">Password</label>
        <input type="password" id="login-pass" class="form-input" value="celebration2026" required>
      </div>

      <a href="#" class="auth-forgot">Forgot your password?</a>

      <div id="login-error" class="form-error" style="color:#8a3560;font-size:.8rem;min-height:1.2rem;text-align:center"></div>

      <button type="submit" class="btn btn-primary btn-full">Sign In to Dashboard</button>
    </form>

    <div class="auth-divider">or continue with</div>

    <div class="social-buttons">
      <button type="button" class="social-btn google-btn">
        <span class="social-btn-icon">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
        </span>
        Continue with Google
      </button>
      <button type="button" class="social-btn apple-btn">
        <span class="social-btn-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.85c.62-.75 1.04-1.8 1.01-2.85-.92.04-2.04.62-2.7 1.39-.58.67-1.09 1.74-1.01 2.78 1.03.08 2.08-.57 2.7-1.32z"/></svg>
        </span>
        Continue with Apple
      </button>
    </div>

    <div class="auth-link-row">
      New couple? <a href="signup.html">Plan With Us</a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
