<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundForge Studios — Where Sound Becomes Art</title>
  <meta name="description" content="SoundForge Studios is a premier music recording, mixing, and mastering studio. Crafting sonic excellence since 2010.">
  <meta name="theme-color" content="#F7F5F9">
  <meta http-equiv="refresh" content="0;url=home1.html">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
      padding: 0;
    }
    main { padding-top: 0; }
    .entry-logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #7C3AED, #5B21B6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #fff;
      margin-bottom: 16px;
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .entry-text { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.5rem; color: #211F26; }
    [data-theme="dark"] .entry-text { color: #F5F2FA; }
    .entry-sub { font-family: 'Inter', sans-serif; font-size: 0.875rem; color: #7A7585; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Inter:wght@400&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <div class="entry-logo">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="6" y="18" width="4" height="12" rx="2" fill="white" opacity="0.9"/>
        <rect x="12" y="10" width="4" height="20" rx="2" fill="white"/>
        <rect x="18" y="6" width="4" height="24" rx="2" fill="white"/>
        <rect x="24" y="12" width="4" height="16" rx="2" fill="white" opacity="0.9"/>
        <rect x="30" y="20" width="4" height="8" rx="2" fill="white" opacity="0.7"/>
        <rect x="0" y="22" width="4" height="6" rx="2" fill="white" opacity="0.7"/>
      </svg>
    </div>
    <div class="entry-text">SoundForge Studios</div>
    <div class="entry-sub">Loading your experience…</div>
    <noscript><a href="home1.html">Enter Site</a></noscript>
  </main>
  <script src="js/theme.js"></script>
</body>
</html>
