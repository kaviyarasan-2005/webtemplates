<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundForge Studios — Artist Login</title>
  <meta name="description" content="Login to the SoundForge Studios artist portal to manage your sessions, files, and invoices.">
  <meta name="theme-color" content="#F7F5F9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/rtl.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--color-bg-primary);
    }
    
    .auth-layout {
      display: flex;
      flex: 1;
    }
    
    .auth-layout__visual {
      flex: 1;
      background: var(--color-studio-black) url('img/hero-studio.jpg') center/cover;
      position: relative;
      display: none;
    }
    .auth-layout__visual::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(124,58,237,0.8) 0%, rgba(17,14,24,0.95) 100%);
    }
    .auth-layout__quote {
      position: absolute;
      bottom: var(--space-12);
      left: var(--space-12);
      right: var(--space-12);
      color: #fff;
      z-index: 2;
    }
    .auth-layout__quote-text {
      font-family: var(--font-primary);
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: var(--space-4);
    }
    .auth-layout__quote-author {
      font-family: var(--font-secondary);
      color: var(--color-champagne-gold);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    
    .auth-layout__form-wrap {
      flex: 1;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--space-10) var(--space-8);
      margin: 0 auto;
    }
    
    @media (min-width: 1024px) {
      .auth-layout__visual { display: block; }
    }
    
    .auth-header { margin-bottom: var(--space-8); text-align: center; }
    .auth-header__logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: var(--gradient-violet);
      border-radius: var(--radius-lg);
      color: #fff;
      font-size: 1.8rem;
      margin-bottom: var(--space-4);
      animation: fade-in-up 0.5s ease-out;
    }
    .auth-header__title { font-size: 1.8rem; font-weight: 800; margin-bottom: var(--space-2); }
    .auth-header__desc { color: var(--color-text-secondary); font-size: 0.95rem; }
    
    .auth-form { animation: fade-in-up 0.5s ease-out 0.1s both; }
    
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: var(--space-6) 0;
      color: var(--color-text-muted);
      font-family: var(--font-secondary);
      font-size: 0.85rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border);
    }
    .auth-divider:not(:empty)::before { margin-right: .25em; }
    .auth-divider:not(:empty)::after { margin-left: .25em; }
    
    .social-login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      width: 100%;
      padding: var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: var(--font-secondary);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      margin-bottom: var(--space-3);
    }
    .social-login-btn:hover { background: var(--color-bg-secondary); border-color: var(--color-electric-violet); }
    .social-login-btn i { font-size: 1.2rem; }
    
    .auth-footer {
      margin-top: var(--space-6);
      text-align: center;
      font-family: var(--font-secondary);
      font-size: 0.9rem;
      color: var(--color-text-secondary);
    }
    .auth-footer a { color: var(--color-electric-violet); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }

    /* Theme Toggle absolute position for login page */
    .auth-theme-toggle {
      position: absolute;
      top: var(--space-6);
      right: var(--space-6);
      z-index: 10;
    }
    [dir="rtl"] .auth-theme-toggle { right: auto; left: var(--space-6); }
  </style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<button class="navbar__control-btn auth-theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
  <i class="ri-moon-fill"></i>
</button>

<div class="auth-layout">
  
  <div class="auth-layout__visual">
    <div class="auth-layout__quote">
      <div class="auth-layout__quote-text">"SoundForge didn't just record my album, they elevated it beyond what I thought was possible."</div>
      <div class="auth-layout__quote-author">— Lyra Sinclair, Platinum Artist</div>
    </div>
  </div>
  
  <div class="auth-layout__form-wrap">
    
    <div class="auth-header">
      <a href="index.html" class="auth-header__logo" aria-label="Back to home">
        <svg width="24" height="24" viewBox="0 0 36 36" fill="none"><rect x="6" y="18" width="4" height="12" rx="2" fill="white" opacity="0.9"/><rect x="12" y="10" width="4" height="20" rx="2" fill="white"/><rect x="18" y="6" width="4" height="24" rx="2" fill="white"/><rect x="24" y="12" width="4" height="16" rx="2" fill="white" opacity="0.9"/><rect x="30" y="20" width="4" height="8" rx="2" fill="white" opacity="0.7"/><rect x="0" y="22" width="4" height="6" rx="2" fill="white" opacity="0.7"/></svg>
      </a>
      <h1 class="auth-header__title">Welcome Back</h1>
      <p class="auth-header__desc">Login to the artist portal to manage your sessions.</p>
    </div>
    
    <form class="form auth-form" id="login-form" novalidate>
      <div class="form__group">
        <label class="form__label" for="email">Email Address</label>
        <div class="form__input-wrap">
          <i class="ri-mail-line form__input-icon"></i>
          <input type="email" class="form__input form__input--with-icon" id="email" name="email" required placeholder="artist@example.com">
        </div>
        <span class="form__feedback"></span>
      </div>
      
      <div class="form__group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-2);">
          <label class="form__label" style="margin-bottom:0;" for="password">Password</label>
          <a href="#" style="font-family:var(--font-secondary); font-size:0.8rem; color:var(--color-electric-violet); text-decoration:none;">Forgot password?</a>
        </div>
        <div class="form__input-wrap">
          <i class="ri-lock-password-line form__input-icon"></i>
          <input type="password" class="form__input form__input--with-icon" id="password" name="password" required placeholder="••••••••">
        </div>
        <span class="form__feedback"></span>
      </div>
      
      <button type="submit" class="btn btn--primary" style="width:100%; margin-top:var(--space-4);">
        Login <i class="ri-arrow-right-line"></i>
      </button>
    </form>
    
    <div class="auth-divider">Or continue with</div>
    
    <div>
      <button class="social-login-btn">
        <i class="ri-google-fill" style="color:#DB4437;"></i> Google
      </button>
      <button class="social-login-btn">
        <i class="ri-apple-fill"></i> Apple
      </button>
    </div>
    
    <div class="auth-footer">
      Don't have an account? <a href="#">Create Account</a>
    </div>
    
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/form-validation.js"></script>
<script>
  // Mock login script to redirect to dashboard on successful "login"
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('login-form');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        // The form-validation.js handles the UI validation.
        // We add a slight delay to simulate an API call before redirecting.
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        
        if (email && pass) {
          const btn = form.querySelector('button[type="submit"]');
          const originalText = btn.innerHTML;
          btn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Authenticating...';
          btn.disabled = true;
          
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        }
      });
    }
  });
</script>
</body>
</html>
