<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus VR | Login</title>
  <meta name="description" content="Login to your Nexus VR account to manage bookings, view stats, and buy bundles.">
  
  <link rel="stylesheet" href="src/css/main.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .split-layout {
      display: flex;
      min-height: 100vh;
      background: var(--clr-bg);
    }
    .split-image {
      display: none;
      flex: 1.1;
      background: url('src/assets/images/login-bg.jpg') center/cover no-repeat;
      position: relative;
    }
    @media(min-width: 1024px) {
      .split-image { display: block; }
    }

    .split-form-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      background: var(--clr-bg);
      box-sizing: border-box;
    }

    /* Top utility bar holding Back link and Theme/RTL toggles - in normal flow, so zero overlap with heading */
    .auth-top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: var(--space-4) var(--space-6);
      width: 100%;
      box-sizing: border-box;
      z-index: 20;
    }

    .auth-back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--clr-text-muted);
      text-decoration: none;
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all var(--transition-fast);
    }
    .auth-back-link:hover {
      color: var(--clr-primary);
      background: rgba(139, 92, 246, 0.15);
      border-color: var(--clr-primary);
      transform: translateX(-2px);
    }
    [dir="rtl"] .auth-back-link:hover {
      transform: translateX(2px);
    }
    [dir="rtl"] .auth-back-link i {
      transform: rotate(180deg);
    }
    [data-theme="light"] .auth-back-link {
      background: rgba(0, 0, 0, 0.05);
      border-color: rgba(0, 0, 0, 0.1);
      color: #374151;
    }
    [data-theme="light"] .auth-back-link:hover {
      background: rgba(139, 92, 246, 0.12);
      color: var(--clr-primary);
      border-color: var(--clr-primary);
    }

    .auth-controls {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .split-form {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--space-4) var(--space-6) var(--space-8);
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--clr-surface-alt);
      padding: var(--space-4);
      color: var(--clr-text-muted);
      cursor: pointer;
      font-weight: 600;
      transition: all var(--transition-fast);
      font-size: 0.95rem;
    }
    .tab-btn.active {
      color: var(--clr-primary);
      border-bottom-color: var(--clr-primary);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Floating theme/RTL controls sit on the page surface instead of the navbar.
       They must keep the shared .btn-icon / .btn-rtl hover fill (primary bg +
       white text), so the resting background is set here instead of inline —
       an inline background would win over the hover rule and leave white
       text on a white surface in light mode. */
    .login-float-btn {
      box-shadow: var(--shadow-sm);
    }

    /* Responsive adjustments for tablet & mobile */
    @media (max-width: 768px) {
      .auth-top-bar {
        padding: 0.75rem 1rem;
      }
      .split-form {
        padding: 0.5rem 1rem 2rem;
      }
      .split-form .auth-logo-wrap {
        margin-bottom: 1.25rem !important;
      }
      .split-form .auth-heading-wrap {
        margin-bottom: 1.25rem !important;
      }
      .split-form .auth-heading-wrap h2 {
        font-size: 1.5rem;
        line-height: 1.25;
      }
    }

    @media (max-width: 480px) {
      .auth-top-bar {
        padding: 0.6rem 0.75rem;
      }
      .auth-back-link {
        padding: 0.35rem 0.65rem;
        font-size: 0.8rem;
      }
      .auth-controls {
        gap: 0.4rem;
      }
      .auth-controls .btn-icon {
        width: 38px;
        height: 38px;
        min-width: 38px;
        min-height: 38px;
        font-size: 1rem;
      }
      .auth-controls .btn-rtl {
        height: 38px;
        min-height: 38px;
        padding: 0 0.85rem;
        font-size: 0.8rem;
      }
      .split-form {
        padding: 0.25rem 0.75rem 1.5rem;
      }
      .split-form .card {
        padding: 0 !important;
      }
      .split-form .card > .p-6 {
        padding: 1.25rem 1rem !important;
      }
      .social-auth-grid {
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem !important;
      }
      .social-auth-btn {
        padding: 0.6rem 0.5rem !important;
        font-size: 0.85rem !important;
      }
    }

    @media (max-width: 360px) {
      .auth-back-link span {
        display: none;
      }
      .auth-back-link {
        padding: 0;
        width: 38px;
        height: 38px;
        justify-content: center;
        border-radius: 50%;
      }
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="src/assets/images/favicon-7.svg">
</head>
<body>

  <div class="split-layout">
    <div class="split-image">
      <div style="position: absolute; bottom: var(--space-8); left: var(--space-8); right: var(--space-8); background: rgba(8,11,20,0.8); padding: var(--space-6); border-radius: var(--radius-md); backdrop-filter: blur(10px); color: #ffffff;">
        <h3 class="mb-2" style="color: #ffffff;">"Nexus VR completely changed how I look at gaming."</h3>
        <p class="m-0" style="color: #9CA3AF;">- IGN Review</p>
      </div>
    </div>
    
    <div class="split-form-wrapper">
      <!-- Clean Top Bar with Controls -->
      <header class="auth-top-bar">
        <div class="auth-controls">
          <button id="theme-toggle" class="btn-icon login-float-btn flex items-center justify-center" aria-label="Toggle Theme">
            <i class="ph ph-moon"></i>
          </button>
          <button id="rtl-toggle" class="btn-rtl login-float-btn">RTL</button>
        </div>
      </header>

      <div class="split-form">
        <div class="flex justify-center mb-8 auth-logo-wrap">
          <a href="home1.html" class="flex items-center gap-2" aria-label="Nexus VR Home" style="text-decoration: none;">
            <img src="src/assets/images/logo.jpg" alt="Nexus VR Logo" style="height: 44px; width: 44px; border-radius: 50%; box-shadow: 0 0 12px rgba(34, 211, 238, 0.5);">
            <span style="font-size: 1.5rem; font-family: var(--font-primary); font-weight: 800; color: var(--clr-text);">Nexus VR</span>
          </a>
        </div>
        <div class="text-center mb-8 auth-heading-wrap">
          <h2 class="mb-2">Welcome Back</h2>
          <p class="m-0 text-muted">Access your dashboard, manage bookings, and view stats.</p>
        </div>
        
        <div class="card p-0 mb-6">
          <div class="flex">
            <button class="tab-btn active" onclick="switchTab(event, 'login')">Login</button>
            <button class="tab-btn" onclick="switchTab(event, 'register')">Register</button>
          </div>
          
          <div class="p-6">
            <!-- Login Form -->
            <div id="login" class="tab-content active">
              <form data-validate action="dashboard.html">
                <div class="form-group">
                  <label class="form-label">Email Address</label>
                  <input type="email" class="form-input" required placeholder="name@example.com">
                  <div class="form-error"></div>
                </div>
                <div class="form-group mb-2">
                  <div class="flex justify-between items-center mb-2">
                    <label class="form-label m-0">Password</label>
                    <a href="#" class="text-small text-primary">Forgot Password?</a>
                  </div>
                  <input type="password" class="form-input" required placeholder="••••••••">
                  <div class="form-error"></div>
                </div>
                <button type="submit" class="btn btn-primary w-full mt-4" style="width: 100%;">Sign In</button>
              </form>
            </div>
            
            <!-- Register Form -->
            <div id="register" class="tab-content">
              <form data-validate action="dashboard.html">
                <div class="form-group">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-input" required placeholder="John Doe">
                  <div class="form-error"></div>
                </div>
                <div class="form-group">
                  <label class="form-label">Email Address</label>
                  <input type="email" class="form-input" required placeholder="name@example.com">
                  <div class="form-error"></div>
                </div>
                <div class="form-group mb-2">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-input" required placeholder="••••••••">
                  <div class="form-error"></div>
                </div>
                <p class="text-small text-muted mt-2">By registering, you agree to our Terms of Service and Privacy Policy.</p>
                <button type="submit" class="btn btn-secondary w-full mt-4" style="width: 100%;">Create Account</button>
              </form>
            </div>
          </div>
        </div>
        
        <div class="text-center mb-6" style="margin-bottom: 1.5rem;">
          <a href="admin.html" style="font-size: 0.8rem; color: var(--clr-text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; transition: color 150ms ease;">
            <i class="ph ph-shield-check" style="color: var(--clr-secondary);"></i>
            <span>Staff &amp; Venue Admin Console &rarr;</span>
          </a>
        </div>
        <div class="text-center text-muted mb-4">Or continue with</div>
        <div class="grid grid-cols-2 gap-4 social-auth-grid">
          <button class="btn social-auth-btn" style="background: var(--clr-surface-alt); color: var(--clr-text);">
            <i class="ph ph-google-logo text-large"></i> Google
          </button>
          <button class="btn social-auth-btn" style="background: var(--clr-surface-alt); color: var(--clr-text);">
            <i class="ph ph-discord-logo text-large" style="color: #5865F2;"></i> Discord
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(e, tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      const current = (e && (e.currentTarget || e.target)) || (window.event && (window.event.currentTarget || window.event.target));
      if (current) current.classList.add('active');
      const targetContent = document.getElementById(tabId);
      if (targetContent) targetContent.classList.add('active');
    }
  </script>
  <script src="src/js/main.js"></script>
  <script src="src/js/forms.js"></script>
</body>
</html>
