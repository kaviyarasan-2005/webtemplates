<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SHIP — Sign Up: Create Your Freight Account</title>
<meta name="description" content="Create your free SHIP account to start tracking shipments, get quotes and manage your freight forwarding operations in one place."/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C0392B'/%3E%3Ctext x='16' y='23' font-family='Arial Black' font-size='18' font-weight='900' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"/>
<link rel="stylesheet" href="css/style.css"/><link rel="stylesheet" href="css/dark-mode.css"/>
</head>
<body class="auth-page">
<!-- Theme & RTL toggles in top right corner -->
<div class="auth-toggles">
  <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme" title="Toggle Theme"><span data-theme-icon></span></button>
  <button class="rtl-toggle" data-rtl-toggle aria-label="Toggle direction" title="Toggle RTL/LTR"><span data-rtl-label>RTL</span></button>
</div>

<div class="auth-bg" aria-hidden="true">
<svg class="auth-bg-wave" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
<path d="M 0 80 Q 360 160 720 80 Q 1080 0 1440 80 L 1440 320 L 0 320 Z" fill="rgba(192,57,43,0.06)"/>
</svg>
</div>

<main class="auth-main">
<div class="auth-card" style="max-width:520px;">
<div style="text-align:center;margin-bottom:24px;">
<a href="index.html" style="display:inline-flex;align-items:center;gap:10px;text-decoration:none;">
<div class="nav-logo-mark" style="width:40px;height:40px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10"/><path d="M12 2v10l4 4"/><circle cx="12" cy="12" r="2"/></svg></div>
<span style="font-family:var(--font-display);font-size:1.6rem;font-weight:900;color:var(--txt-primary);">SHIP</span>
</a>
</div>

<h1 style="text-align:center;margin-bottom:4px;font-size:1.3rem;font-weight:700;">Create Your Account</h1>
<p style="text-align:center;font-size:.85rem;color:var(--txt-muted);margin-bottom:28px;">Join 8,000+ shippers on the SHIP platform</p>

<form id="signupForm" novalidate>
<div class="form-row">
<div class="form-group">
<label class="form-label" for="signupFirst">First Name</label>
<input class="form-input" type="text" id="signupFirst" placeholder="Marcus" required autocomplete="given-name"/>
<div class="form-error">First name is required</div>
</div>
<div class="form-group">
<label class="form-label" for="signupLast">Last Name</label>
<input class="form-input" type="text" id="signupLast" placeholder="Reid" required autocomplete="family-name"/>
<div class="form-error">Last name is required</div>
</div>
</div>
<div class="form-group">
<label class="form-label" for="signupCompany">Company Name</label>
<input class="form-input" type="text" id="signupCompany" placeholder="Your Company Ltd" autocomplete="organization"/>
</div>
<div class="form-group">
<label class="form-label" for="signupEmailField">Email Address</label>
<input class="form-input" type="email" id="signupEmailField" placeholder="ops@company.com" required autocomplete="email"/>
<div class="form-error">Please enter a valid email</div>
</div>
<div class="form-row">
<div class="form-group">
<label class="form-label" for="signupPassword">Password</label>
<input class="form-input" type="password" id="signupPassword" placeholder="Min 8 characters" required autocomplete="new-password" minlength="8"/>
<div class="form-error">Password must be at least 8 characters</div>
</div>
<div class="form-group">
<label class="form-label" for="confirmPassword">Confirm Password</label>
<input class="form-input" type="password" id="confirmPassword" placeholder="Repeat password" required autocomplete="new-password"/>
<div class="form-error">Passwords do not match</div>
</div>
</div>
<!-- Account type -->
<div style="margin-bottom:20px;">
<p class="form-label" style="margin-bottom:8px;">Account Type</p>
<div class="role-selector">
<button class="role-btn active" data-role="client" type="button">Shipper</button>
<button class="role-btn" data-role="agent" type="button">Freight Agent</button>
<button class="role-btn" data-role="enterprise" type="button">Enterprise</button>
</div>
</div>
<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:24px;">
<input type="checkbox" id="termsCheck" style="margin-top:3px;accent-color:var(--clr-accent);flex-shrink:0;"/>
<label for="termsCheck" style="font-size:.83rem;color:var(--txt-secondary);">I agree to the <a href="#" style="color:var(--clr-accent);">Terms of Service</a> and <a href="#" style="color:var(--clr-accent);">Privacy Policy</a></label>
</div>
<button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;">Create Account</button>
</form>

<div style="display:flex;align-items:center;gap:12px;margin:20px 0;"><div style="flex:1;height:1px;background:var(--border-subtle);"></div><span style="font-size:.78rem;color:var(--txt-muted);">or sign up with</span><div style="flex:1;height:1px;background:var(--border-subtle);"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;">
<button class="social-btn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Google</button>
<button class="social-btn apple" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>Apple</button>
</div>
<p style="text-align:center;font-size:.83rem;color:var(--txt-muted);">Already have an account? <a href="login.html" style="color:var(--clr-accent);font-weight:600;">Sign In</a></p>
</div>
</main>

<script src="js/main.js"></script>
<script>
// Role btn toggle for signup page
document.querySelectorAll('.auth-main .role-selector .role-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    btn.closest('.role-selector').querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
</body>
</html>
