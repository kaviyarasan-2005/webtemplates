<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SHIP — Cargo Not Found (404)</title>
<meta name="description" content="Cargo Not Found. The waypoint or maritime route you navigated to is off the radar. Return to SHIP port."/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C0392B'/%3E%3Ctext x='16' y='23' font-family='Arial Black' font-size='18' font-weight='900' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"/>
<link rel="stylesheet" href="css/style.css"/><link rel="stylesheet" href="css/dark-mode.css"/>
</head>
<body class="page-404">

<!-- Topbar with Logo top-left and Toggles top-right -->
<div style="position:absolute;top:24px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;z-index:20;">
  <a href="index.html" class="nav-logo" title="Return to SHIP Home">
    <div class="nav-logo-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10"/><path d="M12 2v10l4 4"/><circle cx="12" cy="12" r="2"/>
      </svg>
    </div>
    <span class="nav-logo-text" style="color:#fff;">SHIP</span>
  </a>

  <div style="display:flex;gap:8px;">
    <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme" style="border-color:rgba(255,255,255,.2);color:#fff;"><span data-theme-icon></span></button>
    <button class="rtl-toggle" data-rtl-toggle aria-label="Toggle RTL/LTR" style="border-color:rgba(255,255,255,.2);color:#fff;"><span data-rtl-label>RTL</span></button>
  </div>
</div>

<!-- Background shipping lane grid lines -->
<div style="position:absolute;inset:0;pointer-events:none;opacity:.08;">
  <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="laneGrid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#fff" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#laneGrid)"/>
  </svg>
</div>

<div style="position:relative;z-index:10;max-width:540px;padding:24px;">
  <!-- Drifting lone buoy SVG -->
  <div class="buoy-svg">
    <svg viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Water ripple -->
      <ellipse cx="60" cy="135" rx="50" ry="10" fill="rgba(255,255,255,0.1)"/>
      <ellipse cx="60" cy="135" rx="35" ry="6" fill="rgba(255,255,255,0.15)"/>
      <!-- Buoy body -->
      <path d="M35 130 L45 80 L75 80 L85 130 Z" fill="#C0392B"/>
      <!-- White stripes on buoy -->
      <path d="M42 96 L47 80 L73 80 L78 96 Z" fill="#FFFFFF"/>
      <path d="M37 122 L40 108 L80 108 L83 122 Z" fill="#FFFFFF"/>
      <!-- Metal framework -->
      <path d="M45 80 L52 35 L68 35 L75 80" stroke="#0D1B2A" stroke-width="3" fill="none"/>
      <line x1="48" y1="58" x2="72" y2="58" stroke="#0D1B2A" stroke-width="3"/>
      <!-- Lantern top -->
      <rect x="54" y="24" width="12" height="12" rx="2" fill="#F1C40F"/>
      <!-- Light beam beacon rings -->
      <circle cx="60" cy="30" r="14" fill="rgba(241,196,15,0.2)"/>
      <circle cx="60" cy="30" r="22" fill="rgba(241,196,15,0.1)"/>
      <!-- Anchor line into water -->
      <line x1="60" y1="135" x2="60" y2="158" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="3 3"/>
    </svg>
  </div>

  <div style="font-family:var(--font-display);font-size:clamp(3rem,8vw,5.5rem);font-weight:900;color:var(--clr-accent);line-height:1;margin-bottom:12px;letter-spacing:-.03em;">
    404
  </div>

  <h1 style="color:#FFFFFF;font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:12px;font-weight:800;">
    Cargo Not Found
  </h1>

  <p style="color:rgba(255,255,255,.8);font-size:1.1rem;margin-bottom:32px;line-height:1.6;">
    This shipment is off the radar. The maritime coordinates or airway bill link you entered do not exist on our global passage plot.
  </p>

  <a href="index.html" class="btn btn-primary" style="padding:14px 28px;font-size:1rem;display:inline-flex;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Return to Port
  </a>
</div>

<script src="js/main.js"></script>
</body>
</html>
