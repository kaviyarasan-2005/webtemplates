<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shipFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#9A1D1D"/>
    </linearGradient>
    <filter id="shipFaviconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Brand Badge Container -->
  <rect width="64" height="64" rx="16" fill="url(#shipFaviconGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none"/>
  
  <!-- SHIP Logistics Vessel & Cargo Emblem -->
  <g transform="translate(10, 10) scale(1.8333)" filter="url(#shipFaviconGlow)">
    <!-- Port bow hull flank -->
    <path d="M12 2.5L3.5 7.5V15L12 21.5V13.5L7 10.5L12 7.5V2.5Z" fill="#FFFFFF" fill-opacity="0.9"/>
    <!-- Starboard bow hull flank -->
    <path d="M12 2.5L20.5 7.5V15L12 21.5V13.5L17 10.5L12 7.5V2.5Z" fill="#FFFFFF"/>
    <!-- Central Navigational Aperture -->
    <polygon points="12,8.8 14.2,10.5 12,12.2 9.8,10.5" fill="#B0251A"/>
  </g>
</svg>
