<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="shipLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#962217"/>
    </linearGradient>
  </defs>
  
  <!-- Logo Mark Container -->
  <rect x="4" y="4" width="40" height="40" rx="8" fill="url(#shipLogoGrad)"/>
  <rect x="5" y="5" width="38" height="38" rx="7" stroke="rgba(255,255,255,0.18)" stroke-width="1" fill="none"/>
  
  <!-- Emblem Mark inside Badge -->
  <g transform="translate(12, 12) scale(1)">
    <!-- Port bow hull flank -->
    <path d="M12 2.5L3.5 7.5V15L12 21.5V13.5L7 10.5L12 7.5V2.5Z" fill="#FFFFFF" fill-opacity="0.9"/>
    <!-- Starboard bow hull flank -->
    <path d="M12 2.5L20.5 7.5V15L12 21.5V13.5L17 10.5L12 7.5V2.5Z" fill="#FFFFFF"/>
    <!-- Navigational diamond cutout -->
    <polygon points="12,8.8 14.2,10.5 12,12.2 9.8,10.5" fill="#C0392B"/>
  </g>
  
  <!-- Typography Wordmark -->
  <text x="56" y="29" font-family="'Syne', 'Inter', system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">SHIP</text>
  <text x="57" y="39" font-family="'Syne', 'Inter', system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="2.8" fill="#C0392B">FREIGHT FORWARDING</text>
</svg>
