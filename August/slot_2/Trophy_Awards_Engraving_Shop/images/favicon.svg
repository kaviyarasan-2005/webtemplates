<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24201A" />
      <stop offset="50%" stop-color="#181510" />
      <stop offset="100%" stop-color="#0E0D0B" />
    </linearGradient>

    <!-- Outer Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEAB2" />
      <stop offset="35%" stop-color="#C9A84C" />
      <stop offset="70%" stop-color="#8C6E26" />
      <stop offset="100%" stop-color="#E5C772" />
    </linearGradient>

    <!-- Primary Trophy Gold Gradient -->
    <linearGradient id="trophyGold" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="25%" stop-color="#F2D785" />
      <stop offset="55%" stop-color="#C9A84C" />
      <stop offset="85%" stop-color="#916E21" />
      <stop offset="100%" stop-color="#5E430B" />
    </linearGradient>

    <!-- Trophy Handle Left Gradient -->
    <linearGradient id="handleLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="50%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#735414" />
    </linearGradient>

    <!-- Trophy Handle Right Gradient -->
    <linearGradient id="handleRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="50%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#735414" />
    </linearGradient>

    <!-- Base Plinth Gradient -->
    <linearGradient id="basePlinth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EED58D" />
      <stop offset="40%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#664C10" />
    </linearGradient>

    <!-- Star & Engraving Gradient -->
    <linearGradient id="starGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF0B8" />
      <stop offset="100%" stop-color="#D9B755" />
    </linearGradient>

    <!-- Soft Radial Glow behind Trophy -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#C9A84C" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="trophyShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base with Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="12" />

  <!-- Inner Subtle Inset Rim -->
  <rect x="34" y="34" width="444" height="444" rx="98" fill="none" stroke="#FCEAB2" stroke-width="2" opacity="0.25" />

  <!-- Ambient Golden Glow -->
  <circle cx="256" cy="245" r="160" fill="url(#centerGlow)" />

  <!-- Trophy Icon Group with Shadow -->
  <g filter="url(#trophyShadow)">
    
    <!-- LEFT HANDLE -->
    <path d="M 175 160 
             C 115 160 88 195 88 234 
             C 88 280 125 305 175 305
             L 175 275
             C 142 275 118 258 118 234
             C 118 212 136 188 175 188 Z" 
          fill="url(#handleLeft)" />

    <!-- RIGHT HANDLE -->
    <path d="M 337 160 
             C 397 160 424 195 424 234 
             C 424 280 387 305 337 305
             L 337 275
             C 370 275 394 258 394 234
             C 394 212 376 188 337 188 Z" 
          fill="url(#handleRight)" />

    <!-- TROPHY CUP BODY -->
    <!-- Main Outer Cup Bowl -->
    <path d="M 152 132 
             C 152 132 256 142 360 132
             L 348 248
             C 348 308 296 344 256 344
             C 216 344 164 308 164 248 Z" 
          fill="url(#trophyGold)" />

    <!-- Cup Rim Top Lip -->
    <ellipse cx="256" cy="132" rx="104" ry="15" fill="#FFF2CE" />
    <ellipse cx="256" cy="132" rx="96" ry="11" fill="#785918" opacity="0.75" />

    <!-- Cup Highlight Curve (Left Side Sheen) -->
    <path d="M 172 145 
             C 180 200 195 285 230 325 
             C 205 315 178 280 172 235 Z" 
          fill="#FFFFFF" opacity="0.32" />

    <!-- Engraved Crest: Center Star -->
    <polygon points="256,192 264,216 290,216 269,231 277,255 256,240 235,255 243,231 222,216 248,216" 
             fill="url(#starGleam)" 
             filter="drop-shadow(0 2px 3px rgba(70,48,6,0.6))" />

    <!-- STEM & CONNECTOR -->
    <!-- Collar Top -->
    <path d="M 226 342 L 286 342 L 280 366 L 232 366 Z" fill="url(#basePlinth)" />
    <rect x="222" y="342" width="68" height="6" rx="3" fill="#FFF2CE" />

    <!-- Stem Column -->
    <rect x="242" y="364" width="28" height="24" fill="url(#trophyGold)" />

    <!-- Base Connector Disc -->
    <ellipse cx="256" cy="388" rx="42" ry="7" fill="#FCEAB2" />

    <!-- PEDESTAL / BASE -->
    <!-- Tier 1 Chamfered Base -->
    <path d="M 204 394 L 308 394 L 320 416 L 192 416 Z" fill="url(#basePlinth)" />
    <!-- Tier 1 Highlight Line -->
    <line x1="206" y1="395" x2="306" y2="395" stroke="#FFFFFF" stroke-width="2.5" opacity="0.65" />

    <!-- Tier 2 Solid Bottom Plinth -->
    <rect x="162" y="416" width="188" height="30" rx="6" fill="#1C1812" stroke="url(#goldBorder)" stroke-width="3" />
    
    <!-- Engraved Plinth Plate -->
    <rect x="186" y="423" width="140" height="16" rx="3" fill="url(#trophyGold)" />
    <line x1="198" y1="431" x2="314" y2="431" stroke="#3A2805" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- SPARKLE / ARTISAN GLINT -->
    <g transform="translate(352, 122)">
      <!-- 4-point Diamond Star Glint -->
      <path d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="4" fill="#FFEAA3" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
