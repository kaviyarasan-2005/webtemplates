<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEAL Premium Insights | Coming Soon</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages/utility.css">
</head>
<body>

  <main class="coming-soon">
    <div class="coming-overlay"></div>
    <div class="container coming-content fade-up">
      <div class="coming-logo">
        <svg width="48" height="48" viewBox="0 0 22 22" fill="none"><path d="M3 11h9" stroke="#B08D3C" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      
      <h1>DEAL Premium Insights</h1>
      <p>We are finalizing our exclusive portal for off-market deal flow, institutional-grade valuation models, and private equity buyer matching. Launching Q1 2027.</p>
      
      <div class="coming-notify mt-8 fade-up delay-1">
        <h3 style="font-size:var(--fs-sm); text-transform:uppercase; letter-spacing:var(--ls-wide); margin-bottom:var(--space-4);">Request Early Access</h3>
        <form id="coming-form" style="display:flex; gap:8px; max-width:400px; margin-inline:auto;">
          <input type="email" placeholder="Enter your email address" class="form-input coming-notify-input" style="flex:1;">
          <button type="submit" class="btn btn-primary coming-notify-btn">Notify Me</button>
        </form>
      </div>

      <div class="mt-10 fade-up delay-2">
        <a href="index.html" class="btn btn-ghost" style="color:rgba(255,255,255,0.7); border-color:rgba(255,255,255,0.2);">Return to Main Site</a>
      </div>
    </div>
  </main>

  <script src="js/core.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/pages/coming-soon.js"></script>
</body>
</html>
